version: 2
updates:
  # Minor/patch bumps are grouped into one PR per ecosystem; majors stay solo.
  # Cap open PRs so Dependabot does not crowd the review queue.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    # Lockfile-only bumps past what an installed dependency allows leave
    # requirements-lock.txt uninstallable. Drop an entry once its pin lifts.
    ignore:
      - dependency-name: multidict # aiohttp 3.14.x requires multidict<7
        versions: [">=7"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      minor-patch:
        update-types: ["minor", "patch"]