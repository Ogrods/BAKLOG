name: CDP smoke (manual)

# On-demand canary for the Connections CDP layer. Not run on push/PR.
on:
  workflow_dispatch:

jobs:
  cdp-integration:
    name: CDP integration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: setup-chrome

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run CDP integration smoke test
        env:
          BAKLOG_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          BAKLOG_CHROMIUM_NO_SANDBOX: "1"
        run: pytest tests/test_cdp_browser.py -m integration -v
