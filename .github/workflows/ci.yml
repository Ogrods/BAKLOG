name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel earlier runs of the same branch/PR when a new commit lands —
# saves minutes and stops stale red checks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the project + its dev extras (ruff, pytest). pyproject.toml
          # is the source of truth for dependency versions; requirements.txt is
          # mirrored for the cloning-and-running-locally path.
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run pytest
        run: pytest -q

  python-windows:
    name: Python (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q

  python-macos:
    name: Python (macOS smoke)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Fast cross-platform smoke on macOS (full suite runs on Ubuntu/Windows).
      # Catches import/path regressions without the 10m full-suite timeout.
      # GitHub macOS runners ship a huge RLIMIT_NOFILE; CPython fork+exec for
      # subprocess.Popen(pipes) then spends ~10s per spawn closing FDs on the
      # runner's huge RLIMIT_NOFILE (see tests/conftest.py darwin setrlimit).
      # test_run_manager.py is omitted here — it is subprocess-heavy (~40 spawns)
      # and fully exercised on Ubuntu + Windows; keeping import/path/client tests.
      - name: Run pytest smoke subset
        run: |
          ulimit -n 256
          pytest -q \
            tests/test_server_personal.py \
            tests/test_server_csrf.py \
            tests/test_fetcher_progress.py \
            tests/test_fetcher_auth_exit.py \
            tests/test_auth_secrets.py \
            tests/test_auth_status_platform.py \
            tests/test_amazon_web_auth.py \
            tests/test_amazon_web_claims.py \
            tests/test_cdp_browser.py \
            tests/test_gog_galaxy_client.py \
            tests/test_itch_local_client.py \
            tests/test_profile_pin.py \
            tests/test_csrf_profiles.py \
            tests/test_server_supabase_auth.py \
            -m "not integration"

  javascript:
    name: JavaScript (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test

      - name: Check JS module size budget
        run: npm run check:module-size

      - name: Lint JavaScript (weight guardrails)
        run: npm run lint

  frontend-build:
    name: Frontend build (esbuild)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Supabase vendor bundle
        run: npm run vendor:supabase

      - name: Build production frontend
        run: npm run build

      - name: Verify manifest
        run: node -e "const m=require('./dist/manifest.json'); if(!m['js/app.js']||!m['app.css']) process.exit(1)"

      - name: Check bundle size budget
        run: npm run check:bundle-size

      - name: Check dist integrity
        run: npm run check:dist-integrity
