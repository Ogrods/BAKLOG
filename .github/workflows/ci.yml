name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel earlier runs of the same branch/PR when a new commit lands —
# saves minutes and stops stale red checks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ubuntu carries comprehensive coverage, split into two parallel lanes so the
  # slow subprocess/timing suite never blocks the critical path:
  #   - python:      everything EXCEPT @pytest.mark.slow
  #   - python-slow: ONLY @pytest.mark.slow (test_run_manager.py et al)
  # --durations=20 surfaces the next bottleneck instead of us blindly bumping caps.
  python:
    name: Python (ruff + pytest, fast)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the project + its dev extras (ruff, pytest). pyproject.toml
          # is the source of truth for dependency versions; requirements.txt is
          # mirrored for the cloning-and-running-locally path.
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      # --force-sugar streams a live "NN%" progress bar to the Actions log even
      # though it is not a TTY, so a long run shows how far it has gotten instead
      # of looking hung. --durations=20 prints the slowest tests at the end.
      - name: Run pytest (excluding slow)
        run: pytest --force-sugar -m "not integration and not slow" --durations=20

  python-slow:
    name: Python (slow suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (slow only)
        run: pytest --force-sugar -m "slow and not integration" --durations=20

  python-windows:
    name: Python (Windows smoke)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Windows is the primary platform, so this smoke is broader than macOS and
      # targets OS-specific code paths (subprocess kill trees, PID/port reclaim,
      # tray, install/startup paths). The slow timing suite runs on Ubuntu's
      # python-slow lane; full cross-platform logic runs on Ubuntu's python lane.
      - name: Run pytest smoke subset
        run: >
          pytest --force-sugar --durations=20 -m "not integration and not slow"
          tests/test_subprocess_guard.py
          tests/test_dev_server_pids.py
          tests/test_stop_baklog.py
          tests/test_idle_watchdog.py
          tests/test_server_single_instance.py
          tests/test_server_shutdown.py
          tests/test_safe_write.py
          tests/test_python_executable.py
          tests/test_startup.py
          tests/test_tray_app.py
          tests/test_tray_lock.py
          tests/test_install_paths.py
          tests/test_packaging_manifest.py
          tests/test_profile_paths.py
          tests/test_server_static_paths.py
          tests/test_server_csrf.py
          tests/test_csrf_profiles.py
          tests/test_profile_pin.py
          tests/test_auth_secrets.py
          tests/test_auth_secrets_atomic.py

  python-macos:
    name: Python (macOS smoke)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Fast cross-platform smoke on macOS (comprehensive suite runs on Ubuntu).
      # Excludes the slow marker (test_run_manager.py et al), which can exceed the
      # cap on macOS runners.
      - name: Run pytest smoke subset
        run: >
          pytest --force-sugar --durations=20 -m "not integration and not slow"
          tests/test_server_csrf.py
          tests/test_fetcher_progress.py
          tests/test_fetcher_auth_exit.py
          tests/test_auth_secrets.py
          tests/test_auth_status_platform.py
          tests/test_cdp_browser.py
          tests/test_gog_galaxy_client.py
          tests/test_itch_local_client.py
          tests/test_profile_pin.py
          tests/test_csrf_profiles.py
          tests/test_install_paths.py
          tests/test_packaging_manifest.py

  javascript:
    name: JavaScript (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test

      - name: Check JS module size budget
        run: npm run check:module-size

      - name: Lint JavaScript (weight guardrails)
        run: npm run lint

  frontend-build:
    name: Frontend build (esbuild)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Supabase vendor bundle
        run: npm run vendor:supabase

      - name: Build production frontend
        run: npm run build

      - name: Verify manifest
        run: node -e "const m=require('./dist/manifest.json'); if(!m['js/app.js']||!m['app.css']) process.exit(1)"

      - name: Check bundle size budget
        run: npm run check:bundle-size

      - name: Check dist integrity
        run: npm run check:dist-integrity
