name: Nightly contracts

on:
  schedule:
    # 13:00 UTC daily - network-bound store contracts, not per-PR.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-contracts
  cancel-in-progress: true

jobs:
  contracts:
    name: release_smoke + free-surface audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run release_smoke contracts
        run: pytest --force-sugar -m release_smoke -q

      - name: Audit free-surface data
        run: python scripts/audit_free_surface_data.py --fail-on high
