# Immutable releases: a push of a v* tag builds the Windows bundle on a clean
# runner, attaches a SHA-256 + a signed build-provenance attestation, and
# publishes the GitHub Release. The artifact is built from the tagged commit by
# CI (not hand-uploaded), so anyone can verify it with `gh attestation verify`.
#
# Policy: tags are immutable. Never move or re-point a published v* tag - cut a
# new patch tag instead. The job refuses to build when the tag does not match
# the version in pyproject.toml, so a tag always names exactly what it ships.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write       # create the GitHub Release
  id-token: write       # OIDC token for provenance signing
  attestations: write   # store the build-provenance attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Verify tag matches pyproject version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $m = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"'
          if (-not $m) { Write-Error "Could not read version from pyproject.toml"; exit 1 }
          $proj = $m.Matches[0].Groups[1].Value
          if ($tag -ne $proj) {
            Write-Error "Tag '$tag' does not match pyproject version '$proj' - bump the version or fix the tag."
            exit 1
          }
          Write-Host "Tag matches pyproject version: $proj"

      # Gate: never publish a release from a commit whose tests do not pass.
      - name: Install Python deps
        run: python -m pip install -e ".[dev]"

      - name: Run Python tests
        run: python -m pytest -q -m "not integration and not slow and not release_smoke"

      - name: Run release smoke tests
        run: python -m pytest -q -m release_smoke

      - name: Install JS deps
        run: npm ci

      - name: Run JS tests
        run: npm test

      - name: Verify production frontend (fail before PyInstaller)
        run: |
          npm run vendor:supabase
          npm run build
          npm run check:dist-integrity
          npm run check:bundle-size

      - name: Verify release auth secrets (fail fast)
        shell: pwsh
        env:
          BAKLOG_SUPABASE_URL: ${{ secrets.BAKLOG_SUPABASE_URL }}
          BAKLOG_SUPABASE_ANON_KEY: ${{ secrets.BAKLOG_SUPABASE_ANON_KEY }}
        run: |
          if (-not $env:BAKLOG_SUPABASE_URL -or -not $env:BAKLOG_SUPABASE_ANON_KEY) {
            Write-Error @"
          GitHub repo secrets BAKLOG_SUPABASE_URL and BAKLOG_SUPABASE_ANON_KEY must be set before tagging.
          v0.8.19 release failed at write_bundle_auth_env (run 28146418432) when these were empty.
          Set secrets under Settings -> Secrets and variables -> Actions, then cut a new patch tag (tags are immutable).
          "@
            exit 1
          }
          Write-Host "Release auth secrets present (values not printed)."

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe not found after Inno Setup install"; exit 1 }
          Write-Host "Inno Setup installed: $iscc"

      - name: Build Windows bundle
        shell: pwsh
        env:
          BAKLOG_SUPABASE_URL: ${{ secrets.BAKLOG_SUPABASE_URL }}
          BAKLOG_SUPABASE_ANON_KEY: ${{ secrets.BAKLOG_SUPABASE_ANON_KEY }}
          BAKLOG_SUPABASE_JWT_SECRET: ${{ secrets.BAKLOG_SUPABASE_JWT_SECRET }}
          BAKLOG_REQUIRE_INSTALLER: "1"
        run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1

      - name: Verify build artifacts exist
        shell: pwsh
        run: |
          foreach ($f in @(
            "release/BAKLOG-win64.zip",
            "release/BAKLOG-win64.sha256",
            "release/BAKLOG-Setup.exe"
          )) {
            if (-not (Test-Path $f)) { Write-Error "Missing build artifact: $f"; exit 1 }
          }
          Get-FileHash release/BAKLOG-win64.zip -Algorithm SHA256 | Format-List

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release/BAKLOG
          format: spdx-json
          output-file: release/BAKLOG-win64.sbom.spdx.json

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/BAKLOG-win64.zip

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: release/BAKLOG-win64.zip
          sbom-path: release/BAKLOG-win64.sbom.spdx.json

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            "release/BAKLOG-win64.zip",
            "release/BAKLOG-win64.sha256",
            "release/BAKLOG-win64.sbom.spdx.json",
            "release/BAKLOG-Setup.exe"
          )
          if (gh release view $tag 2>$null) {
            Write-Host "Release $tag exists; uploading replacement assets (--clobber)."
            gh release upload $tag @assets --clobber
            gh release edit $tag --title "BAKLOG $tag" --draft=false --latest
          } else {
            gh release create $tag @assets --title "BAKLOG $tag" --generate-notes
          }
