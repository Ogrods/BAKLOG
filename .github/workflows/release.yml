# Immutable releases: a push of a v* tag builds Windows (then attaches macOS +
# Linux), with SHA-256 + signed build-provenance where configured, and
# publishes the GitHub Release. Artifacts are built from the tagged commit by
# CI (not hand-uploaded), so anyone can verify with `gh attestation verify`.
#
# Windows Authenticode: when vars.SIGNING_ENABLED == 'true', the build job signs
# the PyInstaller exes before zip/Inno and BAKLOG-Setup.exe after Inno, via Azure
# Artifact Signing (OIDC, `release` environment). Otherwise it warns and ships unsigned.
#
# Policy: prefer not to move tags. If a published installer is broken for
# strangers/beta, replace the SAME version: fix on main, run
# scripts/replace_release_tag.ps1 -Version X.Y.Z -Force (deletes tag + release,
# re-tags HEAD, re-runs this workflow). Do not bump patch solely for a broken
# public build. release.yml uploads assets with --clobber when the release
# already exists (same tag re-run).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write       # create the GitHub Release
  id-token: write       # OIDC token for provenance signing
  attestations: write   # store the build-provenance attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    # Environment secrets AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
    # back the Entra federated credential (subject ...:environment:release).
    environment: release
    permissions:
      contents: write       # publish the GitHub Release from this job
      id-token: write       # OIDC for azure/login + build provenance
      attestations: write
    env:
      SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
    steps:
      - uses: actions/checkout@v6

      # Signing is off until the owner sets SIGNING_ENABLED=true (repo or
      # release-environment variable). Unsigned builds still publish, with a warning.
      - name: Check code signing config
        shell: pwsh
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        run: |
          if ($env:SIGNING_ENABLED -ne 'true') {
            Write-Host "::warning title=Unsigned Windows build::SIGNING_ENABLED is not 'true', so BAKLOG.exe, BAKLOG Tray.exe and BAKLOG-Setup.exe will be published UNSIGNED."
            exit 0
          }
          if (-not $env:AZURE_SIGNING_ENDPOINT) {
            Write-Host "::error title=Signing misconfigured::SIGNING_ENABLED=true but variable AZURE_SIGNING_ENDPOINT is empty. Set it to the signing account endpoint URI (region-specific) or set SIGNING_ENABLED to false."
            exit 1
          }
          Write-Host "Code signing enabled (Azure Artifact Signing)."

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Verify tag matches pyproject version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $m = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"'
          if (-not $m) { Write-Error "Could not read version from pyproject.toml"; exit 1 }
          $proj = $m.Matches[0].Groups[1].Value
          if ($tag -ne $proj) {
            Write-Error "Tag '$tag' does not match pyproject version '$proj' - bump the version or fix the tag."
            exit 1
          }
          Write-Host "Tag matches pyproject version: $proj"

      - name: Verify version stamps and CHANGELOG section
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          python scripts/release_notes.py versions
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/release_notes.py notes $tag --out release-notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Gate: never publish a release from a commit whose tests do not pass.
      - name: Install Python deps
        run: python -m pip install -e ".[dev]"

      - name: Run Python tests
        run: python -m pytest -q -m "not integration and not slow and not release_smoke"

      - name: Run release smoke tests
        run: python -m pytest -q -m release_smoke

      - name: Install JS deps
        run: npm ci

      - name: Run JS tests
        run: npm test

      - name: Verify production frontend (fail before PyInstaller)
        run: |
          npm run vendor:supabase
          npm run build
          npm run check:dist-integrity
          npm run check:bundle-size

      - name: Verify release auth secrets (fail fast)
        shell: pwsh
        env:
          BAKLOG_SUPABASE_URL: ${{ secrets.BAKLOG_SUPABASE_URL }}
          BAKLOG_SUPABASE_ANON_KEY: ${{ secrets.BAKLOG_SUPABASE_ANON_KEY }}
        run: |
          if (-not $env:BAKLOG_SUPABASE_URL -or -not $env:BAKLOG_SUPABASE_ANON_KEY) {
            Write-Error @"
          GitHub repo secrets BAKLOG_SUPABASE_URL and BAKLOG_SUPABASE_ANON_KEY must be set before tagging.
          v0.8.19 release failed at write_bundle_auth_env (run 28146418432) when these were empty.
          Set secrets under Settings -> Secrets and variables -> Actions, then cut a new patch tag (tags are immutable).
          "@
            exit 1
          }
          Write-Host "Release auth secrets present (values not printed)."

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe not found after Inno Setup install"; exit 1 }
          Write-Host "Inno Setup installed: $iscc"

      - name: Build Windows bundle
        shell: pwsh
        env:
          BAKLOG_SUPABASE_URL: ${{ secrets.BAKLOG_SUPABASE_URL }}
          BAKLOG_SUPABASE_ANON_KEY: ${{ secrets.BAKLOG_SUPABASE_ANON_KEY }}
        run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1 -Stage Bundle

      - name: Azure login (bundle signing)
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: List bundle executables to sign
        id: bundle_files
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $list = Join-Path $env:RUNNER_TEMP "sign-bundle.txt"
          & ./scripts/sign_windows_artifacts.ps1 -List -Root release/BAKLOG -OutFile $list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $delim = "EOF_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "files<<$delim"
          Get-Content $list | Add-Content -Path $env:GITHUB_OUTPUT
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delim

      - name: Sign bundle executables
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT || 'baklog-signing' }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE || 'baklog-release' }}
          files: ${{ steps.bundle_files.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify bundle signatures
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          EXPECTED_SUBJECT: ${{ vars.AZURE_SIGNING_EXPECTED_SUBJECT }}
        run: |
          $opts = @{ Verify = $true; Root = "release/BAKLOG" }
          if ($env:EXPECTED_SUBJECT) { $opts.ExpectedSubject = $env:EXPECTED_SUBJECT }
          & ./scripts/sign_windows_artifacts.ps1 @opts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer and zip
        shell: pwsh
        env:
          BAKLOG_REQUIRE_INSTALLER: "1"
        run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1 -Stage Package

      # Re-login: the GitHub OIDC assertion azure/login cached can expire during
      # the Inno Setup compress, which would fail the second signing call.
      - name: Azure login (installer signing)
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign installer
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT || 'baklog-signing' }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE || 'baklog-release' }}
          files: ${{ github.workspace }}\release\BAKLOG-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify installer signature
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          EXPECTED_SUBJECT: ${{ vars.AZURE_SIGNING_EXPECTED_SUBJECT }}
        run: |
          $opts = @{ Verify = $true; Path = "release/BAKLOG-Setup.exe" }
          if ($env:EXPECTED_SUBJECT) { $opts.ExpectedSubject = $env:EXPECTED_SUBJECT }
          & ./scripts/sign_windows_artifacts.ps1 @opts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify build artifacts exist
        shell: pwsh
        run: |
          foreach ($f in @(
            "release/BAKLOG-win64.zip",
            "release/BAKLOG-win64.sha256",
            "release/BAKLOG-Setup.exe"
          )) {
            if (-not (Test-Path $f)) { Write-Error "Missing build artifact: $f"; exit 1 }
          }
          Get-FileHash release/BAKLOG-win64.zip -Algorithm SHA256 | Format-List

      - name: Silent install smoke (BAKLOG-Setup.exe)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/verify_inno_install_smoke.ps1

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release/BAKLOG
          format: spdx-json
          output-file: release/BAKLOG-win64.sbom.spdx.json

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/BAKLOG-win64.zip

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: release/BAKLOG-win64.zip
          sbom-path: release/BAKLOG-win64.sbom.spdx.json

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            "release/BAKLOG-win64.zip",
            "release/BAKLOG-win64.sha256",
            "release/BAKLOG-win64.sbom.spdx.json",
            "release/BAKLOG-Setup.exe"
          )
          if (gh release view $tag 2>$null) {
            Write-Host "Release $tag exists; uploading replacement assets (--clobber)."
            gh release upload $tag @assets --clobber
            gh release edit $tag --title "BAKLOG $tag" --notes-file release-notes.md --draft=false --latest
          } else {
            gh release create $tag @assets --title "BAKLOG $tag" --notes-file release-notes.md
          }

  build-macos:
    name: Build and attach macOS release
    runs-on: macos-latest
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Verify release auth secrets (fail fast)
        env:
          BAKLOG_SUPABASE_URL: ${{ secrets.BAKLOG_SUPABASE_URL }}
          BAKLOG_SUPABASE_ANON_KEY: ${{ secrets.BAKLOG_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$BAKLOG_SUPABASE_URL" ] || [ -z "$BAKLOG_SUPABASE_ANON_KEY" ]; then
            echo "::error::GitHub repo secrets BAKLOG_SUPABASE_URL and BAKLOG_SUPABASE_ANON_KEY must be set before tagging."
            exit 1
          fi
          echo "Release auth secrets present (values not printed)."

      - name: Build macOS bundle
        env:
          BAKLOG_SUPABASE_URL: ${{ secrets.BAKLOG_SUPABASE_URL }}
          BAKLOG_SUPABASE_ANON_KEY: ${{ secrets.BAKLOG_SUPABASE_ANON_KEY }}
        run: bash packaging/build_macos.sh

      - name: Verify macOS artifacts exist
        run: |
          test -f release/BAKLOG-macos.zip
          test -f release/BAKLOG-macos.sha256
          shasum -a 256 release/BAKLOG-macos.zip

      - name: Upload macOS assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release upload "$tag" release/BAKLOG-macos.zip release/BAKLOG-macos.sha256 --clobber

  build-linux:
    name: Build and attach Linux release
    runs-on: ubuntu-22.04
    needs: build
    timeout-minutes: 45
    env:
      BAKLOG_NO_BROWSER: "1"
      BAKLOG_NO_CHROMIUM_DOWNLOAD: "1"
      BAKLOG_IDLE_SHUTDOWN_MINUTES: "0"
      BAKLOG_PROFILE: smoke
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install zip utility
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Verify release auth secrets (fail fast)
        env:
          BAKLOG_SUPABASE_URL: ${{ secrets.BAKLOG_SUPABASE_URL }}
          BAKLOG_SUPABASE_ANON_KEY: ${{ secrets.BAKLOG_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$BAKLOG_SUPABASE_URL" ] || [ -z "$BAKLOG_SUPABASE_ANON_KEY" ]; then
            echo "::error::GitHub repo secrets BAKLOG_SUPABASE_URL and BAKLOG_SUPABASE_ANON_KEY must be set before tagging."
            exit 1
          fi
          echo "Release auth secrets present (values not printed)."

      - name: Build Linux bundle
        env:
          BAKLOG_SUPABASE_URL: ${{ secrets.BAKLOG_SUPABASE_URL }}
          BAKLOG_SUPABASE_ANON_KEY: ${{ secrets.BAKLOG_SUPABASE_ANON_KEY }}
        run: bash packaging/build_linux.sh

      - name: Verify bundled auth .env after build
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.frozen_bundle_smoke import _env_has_auth_keys
          env_path = Path("release/BAKLOG/.env")
          ok, missing = _env_has_auth_keys(env_path)
          assert ok, f"bundled .env invalid after build: missing {missing}"
          print(f"bundled auth ok: {env_path}")
          PY

      - name: Isolate smoke home (XDG)
        run: |
          mkdir -p "$RUNNER_TEMP/baklog-home/.local/share"
          echo "HOME=$RUNNER_TEMP/baklog-home" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/baklog-home/.local/share" >> "$GITHUB_ENV"

      - name: Chromium pin smoke (linux64)
        run: |
          python - <<'PY'
          from shared.chromium_runtime import is_allowed_cft_url, load_pin, platform_key
          assert platform_key() == "linux64", platform_key()
          pin = load_pin()
          entry = (pin.get("platforms") or {}).get("linux64")
          assert isinstance(entry, dict), entry
          url = str(entry.get("url") or "")
          sha = str(entry.get("sha256") or "")
          assert is_allowed_cft_url(url), url
          assert len(sha) == 64, sha
          print("chromium pin linux64 ok")
          PY

      - name: XDG data-dir smoke
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from shared.install_paths import default_frozen_data_dir
          home = Path(os.environ["HOME"]).resolve()
          xdg = Path(os.environ["XDG_DATA_HOME"]).resolve()
          got = default_frozen_data_dir()
          expect = (xdg / "baklog").resolve()
          assert got == expect, (got, expect, home)
          print(f"default_frozen_data_dir ok: {got}")
          PY

      - name: Frozen import smoke
        run: python scripts/frozen_import_smoke.py --exe release/BAKLOG/BAKLOG

      - name: Frozen data-dir migration smoke
        run: python scripts/frozen_data_dir_migration_smoke.py --bundle-dir release/BAKLOG --port 8766

      - name: Frozen bundle smoke
        run: python scripts/frozen_bundle_smoke.py release/BAKLOG --port 8765

      - name: Frozen connect smoke
        run: python scripts/frozen_connect_smoke.py --exe release/BAKLOG/BAKLOG --port 8767

      - name: Verify bundled auth .env survived smokes
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.frozen_bundle_smoke import _env_has_auth_keys
          env_path = Path("release/BAKLOG/.env")
          ok, missing = _env_has_auth_keys(env_path)
          assert ok, f"bundled .env lost during smokes: missing {missing}"
          print(f"bundled auth intact: {env_path}")
          PY

      - name: Verify Linux artifacts exist
        run: |
          test -f release/BAKLOG-linux64.zip
          test -f release/BAKLOG-linux64.sha256
          test -x release/BAKLOG/BAKLOG
          test -x "release/BAKLOG/Start BAKLOG.sh"
          test ! -e "release/BAKLOG/BAKLOG Tray"
          (
            cd release
            sha256sum -c BAKLOG-linux64.sha256
          )
          ls -lh release/BAKLOG-linux64.zip release/BAKLOG-linux64.sha256

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release/BAKLOG
          format: spdx-json
          output-file: release/BAKLOG-linux64.sbom.spdx.json

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/BAKLOG-linux64.zip

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: release/BAKLOG-linux64.zip
          sbom-path: release/BAKLOG-linux64.sbom.spdx.json

      - name: Upload Linux assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release upload "$tag" \
            release/BAKLOG-linux64.zip \
            release/BAKLOG-linux64.sha256 \
            release/BAKLOG-linux64.sbom.spdx.json \
            --clobber
