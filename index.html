<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steam Backlog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    th { cursor: pointer; user-select: none; }
    th:hover { background: rgb(51 65 85); }
    .cover { width: 40px; height: 60px; object-fit: cover; border-radius: 4px; background: #1e293b; }
    .placeholder { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 10px; text-align: center; padding: 2px; }
    .pick-cover { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 4px; background: #1e293b; }
    .pick-card { transition: transform 0.1s ease, background 0.1s ease; }
    .pick-card:hover { transform: translateY(-2px); background: rgb(51 65 85); }
    .pick-tab.active { border-color: #38bdf8; color: #e2e8f0; background: rgba(14, 165, 233, 0.15); }
    .genre-chip.active { background: #0284c7; border-color: #0ea5e9; color: #f8fafc; }
    .status-next { background: rgba(14, 165, 233, 0.08); box-shadow: inset 3px 0 0 #38bdf8; }
    .status-playing { background: rgba(16, 185, 129, 0.08); box-shadow: inset 3px 0 0 #10b981; }
    .status-finished { opacity: 0.72; box-shadow: inset 3px 0 0 #94a3b8; }
    .status-skip { opacity: 0.48; box-shadow: inset 3px 0 0 #64748b; }
    .status-skip .game-name { text-decoration: line-through; }
    .low-confidence { box-shadow: inset 6px 0 0 #f59e0b; }
    .row-picked { outline: 2px solid #eab308; outline-offset: -2px; }
    .store-chip.active { background: #7c3aed; border-color: #a78bfa; color: #f8fafc; }
    .store-badge { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; vertical-align: middle; margin-right: 4px; }
    .store-badge.steam { background: #0369a1; color: #e0f2fe; }
    .store-badge.gog { background: #6d28d9; color: #ede9fe; }
    .pick-store { position: absolute; top: 4px; right: 4px; font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div class="max-w-[1600px] mx-auto p-4 md:p-6">
    <header class="mb-4">
      <h1 class="text-2xl md:text-3xl font-bold text-sky-400">Game Backlog</h1>
      <p id="meta" class="text-slate-400 text-sm mt-1">Loading...</p>
      <div id="summary" class="flex flex-wrap gap-2 mt-3"></div>
    </header>

    <section class="bg-slate-800 rounded-lg mb-4">
      <div class="flex flex-wrap items-center gap-2 p-3 border-b border-slate-700">
        <button id="togglePicks" class="px-2 py-1 rounded bg-slate-700 text-xs">Hide</button>
        <h2 class="text-sm font-semibold tracking-wide text-slate-200 uppercase">Picks</h2>
        <button class="pick-tab px-2 py-1 rounded border border-slate-600 text-xs active" data-tab="topRated">Top Rated</button>
        <button class="pick-tab px-2 py-1 rounded border border-slate-600 text-xs" data-tab="nextUp">Next Up</button>
        <button class="pick-tab px-2 py-1 rounded border border-slate-600 text-xs" data-tab="quickWins">Quick Wins</button>
        <button class="pick-tab px-2 py-1 rounded border border-slate-600 text-xs" data-tab="hiddenGems">Hidden Gems</button>
        <label class="text-xs text-slate-300 ml-auto">Quick-win max hours:
          <input id="quickWinMax" type="range" min="2" max="40" value="15" class="align-middle w-24" />
          <span id="quickWinMaxVal">15</span>
        </label>
        <span id="pickMeta" class="text-xs text-slate-400"></span>
      </div>
      <div id="picksContainer" class="p-3">
        <div id="picksGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 xl:grid-cols-8 gap-2"></div>
      </div>
    </section>

    <section class="bg-slate-800 rounded-lg p-4 mb-4 space-y-3">
      <div class="flex flex-wrap gap-2 items-center">
        <input id="search" type="search" placeholder="Search games..." class="bg-slate-700 border border-slate-600 rounded px-3 py-2 flex-1 min-w-[220px]" />
        <select id="statusFilter" class="bg-slate-700 border border-slate-600 rounded px-3 py-2">
          <option value="">All statuses</option>
          <option value="backlog">Backlog</option>
          <option value="next">Next up</option>
          <option value="playing">Playing</option>
          <option value="finished">Finished</option>
          <option value="skip">Skip</option>
        </select>
        <label class="flex items-center gap-1 text-xs bg-slate-700 border border-slate-600 rounded px-2 py-2">
          Genre mode
          <select id="genreMode" class="bg-slate-700">
            <option value="OR">OR</option>
            <option value="AND">AND</option>
          </select>
        </label>
        <label class="flex items-center gap-2 text-sm">
          <input id="unplayedOnly" type="checkbox" class="rounded" />
          Unplayed only
        </label>
      </div>
      <div id="storeChips" class="flex flex-wrap gap-2 items-center">
        <span class="text-xs text-slate-400 mr-1">Store</span>
        <button class="store-chip px-2 py-1 rounded border border-slate-600 text-xs active bg-slate-700" data-store="">All</button>
        <button class="store-chip px-2 py-1 rounded border border-slate-600 text-xs bg-slate-700" data-store="steam">Steam</button>
        <button class="store-chip px-2 py-1 rounded border border-slate-600 text-xs bg-slate-700" data-store="gog">GOG</button>
      </div>
      <div id="genreChips" class="flex flex-wrap gap-2"></div>
      <div class="flex flex-wrap gap-4 items-center text-sm">
        <label>Min rating %
          <input id="minRating" type="range" min="0" max="100" value="0" class="align-middle w-24" />
          <span id="minRatingVal">0</span>
        </label>
        <label>Max length (h)
          <input id="maxHours" type="range" min="0" max="200" value="200" class="align-middle w-24" />
          <span id="maxHoursVal">200+</span>
        </label>
        <label class="flex items-center gap-2">
          <input id="showScoreColumn" type="checkbox" />
          Show score column
        </label>
        <button id="pickForMe" class="bg-amber-700 hover:bg-amber-600 px-3 py-1.5 rounded text-sm">Pick for me</button>
        <button id="reloadData" class="bg-cyan-700 hover:bg-cyan-600 px-3 py-1.5 rounded text-sm">Reload library</button>
        <div class="ml-auto flex gap-2">
          <label class="bg-sky-700 hover:bg-sky-600 px-3 py-1.5 rounded text-sm cursor-pointer">
            Load games.json
            <input id="loadGamesFile" type="file" accept=".json" class="hidden" />
          </label>
          <button id="exportCsv" class="bg-slate-600 hover:bg-slate-500 px-3 py-1.5 rounded text-sm">Export CSV</button>
          <button id="exportNotes" class="bg-slate-600 hover:bg-slate-500 px-3 py-1.5 rounded text-sm">Export notes</button>
          <label class="bg-slate-600 hover:bg-slate-500 px-3 py-1.5 rounded text-sm cursor-pointer">
            Import notes
            <input id="importNotes" type="file" accept=".json" class="hidden" />
          </label>
        </div>
      </div>
    </section>

    <div class="overflow-x-auto rounded-lg border border-slate-700">
      <table class="w-full text-sm">
        <thead class="bg-slate-800 text-slate-300">
          <tr>
            <th class="p-2 w-12"></th>
            <th data-sort="name" class="p-2 text-left">Game</th>
            <th data-sort="status" class="p-2 text-left">Status</th>
            <th data-sort="priority" class="p-2 text-center">Pri</th>
            <th id="scoreHeader" data-sort="priority_score" class="p-2 text-right hidden">Score</th>
            <th data-sort="playtime_minutes" class="p-2 text-right">Played</th>
            <th data-sort="hltb_main_hours" class="p-2 text-right" title="Main / Main+Extra / 100%">HLTB M/E/C</th>
            <th data-sort="steam_review_percent" class="p-2 text-right">Steam %</th>
            <th data-sort="metacritic_score" class="p-2 text-right">Meta</th>
            <th data-sort="discount_percent" class="p-2 text-right">Price</th>
            <th data-sort="release_date" class="p-2 text-left">Released</th>
            <th data-sort="last_played" class="p-2 text-left">Last played</th>
            <th class="p-2 text-left">Genres</th>
            <th class="p-2 text-left">Notes</th>
          </tr>
        </thead>
        <tbody id="tbody" class="divide-y divide-slate-700"></tbody>
      </table>
    </div>
    <p id="rowCount" class="text-slate-400 text-sm mt-2"></p>
  </div>

  <script>
    const STORAGE_KEY = "steam-backlog-personal";
    const PREFS_KEY = "steam-backlog-ui-prefs";
    let allGames = [];
    let personal = loadPersonal();
    let prefs = loadPrefs();
    let sortKey = "name";
    let sortDir = 1;
    let expandedKeys = new Set();
    let pickedKey = null;
    let libraryMeta = { steam: null, gog: null };

    window.coverFallback = function (img) {
      const fb = img.dataset.fallback;
      if (fb && img.src !== fb) {
        img.src = fb;
        img.dataset.fallback = "";
        return;
      }
      const name = img.dataset.name || "";
      const cls = img.classList.contains("pick-cover") ? "pick-cover placeholder" : "cover placeholder";
      img.outerHTML = `<div class="${cls}" title="${name.replace(/"/g, "&quot;")}">${name.slice(0, 18)}</div>`;
    };

    function loadPersonal() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch { return {}; }
    }
    function migrateV3() {
      if (personal.__migrated_v3) return;
      const next = {};
      for (const [k, v] of Object.entries(personal)) {
        if (k === "__migrated_v3") continue;
        if (String(k).includes(":")) next[k] = v;
        else next[`steam:${k}`] = v;
      }
      next.__migrated_v3 = true;
      personal = next;
      savePersonal();
    }
    function savePersonal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(personal)); }
    function loadPrefs() {
      const fallback = { picksTab: "topRated", picksCollapsed: false, showScoreColumn: false, genreFilters: [], genreFilterMode: "OR", quickWinMaxHours: 15, storeFilter: "" };
      try { return { ...fallback, ...(JSON.parse(localStorage.getItem(PREFS_KEY) || "{}")) }; } catch { return fallback; }
    }
    function savePrefs() { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); }
    function normalizeGame(g) {
      const store = g.store || "steam";
      const id = g.id ?? g.appid ?? g.gog_id;
      return { ...g, store, id };
    }
    function gameKey(g) {
      const ng = normalizeGame(g);
      return `${ng.store}:${ng.id}`;
    }
    function gameNumericId(g) {
      return normalizeGame(g).id;
    }
    function coverFallbackFor(g) {
      const ng = normalizeGame(g);
      if (ng.header_image) return ng.header_image;
      if (ng.store === "steam") return `https://cdn.akamai.steamstatic.com/steam/apps/${ng.id}/header.jpg`;
      return "";
    }
    function getPersonal(g) {
      const key = gameKey(g);
      if (personal[key]) return personal[key];
      const legacy = personal[normalizeGame(g).id];
      if (legacy && typeof legacy === "object") return legacy;
      return { status: "backlog", notes: "", priority: 0, hltb_override: null };
    }
    function setPersonal(g, field, value) {
      const key = gameKey(g);
      if (!personal[key]) personal[key] = { status: "backlog", notes: "", priority: 0, hltb_override: null };
      personal[key][field] = value;
      savePersonal();
      renderSummary();
      renderPicks();
    }
    function hltbMain(g) {
      const p = getPersonal(g);
      if (p.hltb_override != null && p.hltb_override !== "") return +p.hltb_override;
      return g.hltb_main_hours;
    }
    function ratingValue(g) { return g.steam_review_percent ?? g.metacritic_score ?? 0; }
    function priorityScore(g) {
      const p = getPersonal(g);
      const review = ratingValue(g);
      const h = hltbMain(g) || 20;
      return (review * (p.priority + 1)) / Math.log2(h + 2);
    }
    function isHiddenGem(g) {
      const p = getPersonal(g);
      const rating = g.steam_review_percent ?? g.metacritic_score ?? 0;
      return rating >= 90 && (g.playtime_minutes || 0) === 0 && p.status !== "skip";
    }
    function storeBadgeHtml(g) {
      const s = normalizeGame(g).store;
      const label = s === "gog" ? "G" : "S";
      return `<span class="store-badge ${s}" title="${s.toUpperCase()}">${label}</span>`;
    }
    function formatHours(minutes) { return !minutes ? "0h" : `${(minutes / 60).toFixed(1)}h`; }
    function formatDate(unixOrStr) {
      if (!unixOrStr) return "—";
      if (typeof unixOrStr === "number") return unixOrStr === 0 ? "—" : new Date(unixOrStr * 1000).toLocaleDateString();
      return unixOrStr;
    }
    function parseReleaseForSort(d) { const t = Date.parse(d || ""); return isNaN(t) ? 0 : t; }
    function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
    function escapeAttr(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

    function filteredGames() {
      const q = document.getElementById("search").value.toLowerCase().trim();
      const status = document.getElementById("statusFilter").value;
      const unplayed = document.getElementById("unplayedOnly").checked;
      const minRating = +document.getElementById("minRating").value;
      const maxHours = +document.getElementById("maxHours").value;
      const genres = prefs.genreFilters;
      const genreMode = prefs.genreFilterMode;

      return allGames.filter(g => {
        const ng = normalizeGame(g);
        const p = getPersonal(g);
        if (prefs.storeFilter && ng.store !== prefs.storeFilter) return false;
        if (q && !g.name.toLowerCase().includes(q)) return false;
        if (status && p.status !== status) return false;
        if (unplayed && (g.playtime_minutes || 0) > 0) return false;
        const rating = ratingValue(g);
        if (minRating > 0 && rating < minRating) return false;
        const h = hltbMain(g);
        if (maxHours < 200 && h != null && h > maxHours) return false;
        if (genres.length) {
          const gameGenres = g.genres || [];
          if (genreMode === "AND") {
            if (!genres.every(x => gameGenres.includes(x))) return false;
          } else if (!genres.some(x => gameGenres.includes(x))) {
            return false;
          }
        }
        return true;
      });
    }

    function sortedGames(list) {
      return [...list].sort((a, b) => {
        const pa = getPersonal(a);
        const pb = getPersonal(b);
        let va;
        let vb;
        switch (sortKey) {
          case "status": va = pa.status; vb = pb.status; break;
          case "priority": va = pa.priority; vb = pb.priority; break;
          case "priority_score": va = priorityScore(a); vb = priorityScore(b); break;
          case "last_played": va = a.last_played || 0; vb = b.last_played || 0; break;
          case "release_date": va = parseReleaseForSort(a.release_date); vb = parseReleaseForSort(b.release_date); break;
          case "hltb_main_hours": va = hltbMain(a); vb = hltbMain(b); break;
          default: va = a[sortKey]; vb = b[sortKey];
        }
        if (va == null) va = sortDir > 0 ? Infinity : -Infinity;
        if (vb == null) vb = sortDir > 0 ? Infinity : -Infinity;
        if (typeof va === "string") return sortDir * va.localeCompare(vb);
        return sortDir * (va - vb);
      });
    }

    function pickCardHtml(g) {
      const key = gameKey(g);
      const headerFallback = coverFallbackFor(g);
      const cover = g.library_image || headerFallback;
      const ratingVal = ratingValue(g);
      const rating = g.steam_review_percent != null ? `${g.steam_review_percent}%` : (g.metacritic_score != null ? `${g.metacritic_score}` : "—");
      const h = hltbMain(g);
      const store = normalizeGame(g).store;
      return `
        <div class="pick-card relative bg-slate-700/50 rounded p-2 cursor-pointer" data-game-key="${escapeAttr(key)}" title="${escapeAttr(g.name)} · ${rating}${h != null ? ` · ${h}h` : ""}">
          <span class="pick-store store-badge ${store}">${store === "gog" ? "G" : "S"}</span>
          <img class="pick-cover" src="${cover}" data-fallback="${escapeAttr(headerFallback)}" data-name="${escapeAttr(g.name)}" alt="" loading="lazy" onerror="window.coverFallback(this)" />
          <div class="text-xs text-slate-200 mt-1 truncate font-medium">${escapeHtml(g.name)}</div>
          <div class="text-xs text-slate-400 flex justify-between"><span>${rating}</span><span>${h != null ? `${h}h` : ""}</span></div>
        </div>`;
    }

    function renderPicks() {
      const tab = prefs.picksTab;
      const backlogRated = allGames
        .filter(g => getPersonal(g).status === "backlog" && ratingValue(g) > 0)
        .sort((a, b) => ratingValue(b) - ratingValue(a));
      const nextUp = allGames.filter(g => getPersonal(g).status === "next").sort((a, b) => {
        const pa = getPersonal(a).priority;
        const pb = getPersonal(b).priority;
        if (pb !== pa) return pb - pa;
        return ratingValue(b) - ratingValue(a);
      });
      const quickWins = allGames
        .filter(g => getPersonal(g).status === "backlog" && ratingValue(g) >= 75 && (hltbMain(g) || 999) <= prefs.quickWinMaxHours)
        .sort((a, b) => ratingValue(b) - ratingValue(a));
      const hidden = allGames.filter(isHiddenGem).sort((a, b) => ratingValue(b) - ratingValue(a));
      const data = tab === "nextUp" ? nextUp : tab === "quickWins" ? quickWins : tab === "hiddenGems" ? hidden : backlogRated;
      const countLabel = `${Math.min(data.length, 12)} of ${data.length}`;
      document.getElementById("pickMeta").textContent = countLabel;
      document.getElementById("picksGrid").innerHTML = data.length
        ? data.slice(0, 12).map(pickCardHtml).join("")
        : '<div class="col-span-full text-sm text-slate-400 italic">No games match this tab yet.</div>';
      document.querySelectorAll(".pick-tab").forEach(el => el.classList.toggle("active", el.dataset.tab === tab));
    }

    function renderSummary() {
      const backlog = allGames.filter(g => getPersonal(g).status === "backlog");
      const totalHltb = backlog.reduce((s, g) => s + (hltbMain(g) || 0), 0);
      const played = allGames.reduce((s, g) => s + (g.playtime_minutes || 0), 0) / 60;
      const steamCount = allGames.filter(g => normalizeGame(g).store === "steam").length;
      const gogCount = allGames.filter(g => normalizeGame(g).store === "gog").length;
      const rated = allGames.filter(g => ratingValue(g) > 0);
      const avg = rated.length ? (rated.reduce((s, g) => s + ratingValue(g), 0) / rated.length).toFixed(0) : "—";
      document.getElementById("summary").innerHTML = `
        <div class="px-3 py-2 rounded-full bg-slate-800 text-xs">Games <span class="text-slate-100 font-semibold ml-1">${allGames.length}</span></div>
        <div class="px-3 py-2 rounded-full bg-slate-800 text-xs">Steam <span class="text-slate-100 font-semibold ml-1">${steamCount}</span></div>
        <div class="px-3 py-2 rounded-full bg-slate-800 text-xs">GOG <span class="text-slate-100 font-semibold ml-1">${gogCount}</span></div>
        <div class="px-3 py-2 rounded-full bg-slate-800 text-xs">Backlog hours <span class="text-slate-100 font-semibold ml-1">${totalHltb.toFixed(0)}h</span></div>
        <div class="px-3 py-2 rounded-full bg-slate-800 text-xs">Played <span class="text-slate-100 font-semibold ml-1">${played.toFixed(0)}h</span></div>
        <div class="px-3 py-2 rounded-full bg-slate-800 text-xs">Avg rating <span class="text-slate-100 font-semibold ml-1">${avg}${avg !== "—" ? "%" : ""}</span></div>`;
    }

    function findGameByKey(key) {
      return allGames.find(g => gameKey(g) === key);
    }

    function rowClass(g, lowConf) {
      const status = getPersonal(g).status;
      const stateClass = status === "next" ? "status-next" : status === "playing" ? "status-playing" : status === "finished" ? "status-finished" : status === "skip" ? "status-skip" : "";
      const lowClass = lowConf ? " low-confidence" : "";
      const picked = pickedKey === gameKey(g) ? " row-picked" : "";
      return `bg-slate-800/50 hover:bg-slate-700/50 ${stateClass}${lowClass}${picked}`;
    }

    function hltbLabel(g) {
      const p = getPersonal(g);
      if (p.hltb_override != null && p.hltb_override !== "") return `${p.hltb_override}* / - / -`;
      const m = g.hltb_main_hours ?? "-";
      const e = g.hltb_main_extra_hours ?? "-";
      const c = g.hltb_completionist_hours ?? "-";
      return `${m} / ${e} / ${c}`;
    }

    function formatPrice(g) {
      if (!g.price && g.discount_percent == null) return "—";
      const base = g.price || "N/A";
      if ((g.discount_percent || 0) > 0) {
        return `${base} (-${g.discount_percent}%)`;
      }
      return base;
    }

    function focusGame(key) {
      expandedKeys.add(key);
      pickedKey = key;
      renderTable();
      const row = document.querySelector(`tr[data-row-key="${key}"]`);
      if (row) row.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function toggleExpand(key) {
      if (expandedKeys.has(key)) expandedKeys.delete(key);
      else expandedKeys.add(key);
      renderTable();
    }

    function renderTable() {
      const list = sortedGames(filteredGames());
      const tbody = document.getElementById("tbody");
      tbody.innerHTML = "";
      const showScore = !!prefs.showScoreColumn;
      document.getElementById("scoreHeader").classList.toggle("hidden", !showScore);

      list.forEach(g => {
        const p = getPersonal(g);
        const lowConf = g.hltb_match_confidence != null && g.hltb_match_confidence < 0.75;
        const hiddenGem = isHiddenGem(g);
        const key = gameKey(g);
        const headerFallback = coverFallbackFor(g);
        const tr = document.createElement("tr");
        tr.dataset.rowKey = key;
        tr.className = rowClass(g, lowConf);
        tr.innerHTML = `
          <td class="p-2"><img class="cover" src="${g.library_image || headerFallback}" data-fallback="${escapeAttr(headerFallback)}" data-name="${escapeAttr(g.name)}" alt="" loading="lazy" onerror="window.coverFallback(this)" /></td>
          <td class="p-2">
            ${storeBadgeHtml(g)}<a href="${g.store_url}" target="_blank" rel="noopener" class="text-sky-400 hover:underline font-medium game-name">${escapeHtml(g.name)}</a>
            ${hiddenGem ? '<span class="ml-1 text-purple-400" title="Hidden gem: 90%+ rated and unplayed">✦</span>' : ""}
            ${lowConf && g.hltb_name ? `<div class="text-xs text-amber-400">HLTB match: ${escapeHtml(g.hltb_name)}</div>` : ""}
          </td>
          <td class="p-2">
            <select data-game-key="${escapeAttr(key)}" data-field="status" class="bg-slate-700 border border-slate-600 rounded text-xs py-1">
              <option value="backlog" ${p.status === "backlog" ? "selected" : ""}>Backlog</option>
              <option value="next" ${p.status === "next" ? "selected" : ""}>Next up</option>
              <option value="playing" ${p.status === "playing" ? "selected" : ""}>Playing</option>
              <option value="finished" ${p.status === "finished" ? "selected" : ""}>Finished</option>
              <option value="skip" ${p.status === "skip" ? "selected" : ""}>Skip</option>
            </select>
          </td>
          <td class="p-2 text-center">
            <select data-game-key="${escapeAttr(key)}" data-field="priority" class="bg-slate-700 border border-slate-600 rounded text-xs py-1">
              ${[0, 1, 2, 3, 4, 5].map(n => `<option value="${n}" ${p.priority === n ? "selected" : ""}>${n || "—"}</option>`).join("")}
            </select>
          </td>
          ${showScore ? `<td class="p-2 text-right">${priorityScore(g).toFixed(1)}</td>` : ""}
          <td class="p-2 text-right text-slate-300">${formatHours(g.playtime_minutes)}</td>
          <td class="p-2 text-right">
            <button data-hltb-edit="${escapeAttr(key)}" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-xs">${hltbLabel(g)}</button>
          </td>
          <td class="p-2 text-right">${g.steam_review_percent != null ? `${g.steam_review_percent}%` : "—"}</td>
          <td class="p-2 text-right">${g.metacritic_score ?? "—"}</td>
          <td class="p-2 text-right">${formatPrice(g)}</td>
          <td class="p-2 text-slate-300">${g.release_date || "—"}</td>
          <td class="p-2 text-slate-300">${formatDate(g.last_played)}</td>
          <td class="p-2 text-slate-400 text-xs max-w-[120px] truncate" title="${(g.genres || []).join(", ")}">${(g.genres || []).slice(0, 2).join(", ") || "—"}</td>
          <td class="p-2"><input type="text" data-game-key="${escapeAttr(key)}" data-field="notes" value="${escapeAttr(p.notes)}" placeholder="Notes..." class="notes-input bg-slate-700 border border-slate-600 rounded text-xs w-full min-w-[100px] px-2 py-1" /></td>`;

        tr.addEventListener("click", e => {
          if (e.target.closest("select, input, a, button")) return;
          toggleExpand(key);
        });

        tbody.appendChild(tr);

        if (expandedKeys.has(key)) {
          const detail = document.createElement("tr");
          detail.className = "bg-slate-800";
          const extra = [
            g.steam_review_desc,
            (g.tags || []).slice(0, 6).join(" · "),
            g.price_initial && g.price_initial !== g.price ? `Was ${g.price_initial}` : null
          ].filter(Boolean).join(" · ");
          const cols = showScore ? 14 : 13;
          detail.innerHTML = `<td colspan="${cols}" class="p-3 text-sm text-slate-300 border-t border-slate-700">
            <img src="${headerFallback}" data-fallback="" data-name="${escapeAttr(g.name)}" class="max-h-24 rounded float-right ml-4" alt="" onerror="window.coverFallback(this)" />
            ${extra || "No extra details."}
            <a href="${g.store_url}" class="text-sky-400 ml-2" target="_blank" rel="noopener">Store →</a>
          </td>`;
          tbody.appendChild(detail);
        }
      });

      document.getElementById("rowCount").textContent = `Showing ${list.length} of ${allGames.length} games`;
    }

    function renderGenreChips() {
      const genres = [...new Set(allGames.flatMap(g => g.genres || []))].sort();
      const html = genres.map(genre => {
        const active = prefs.genreFilters.includes(genre);
        return `<button class="genre-chip px-2 py-1 rounded border border-slate-600 text-xs ${active ? "active" : "bg-slate-700 text-slate-300"}" data-genre="${escapeAttr(genre)}">${escapeHtml(genre)}</button>`;
      }).join("");
      document.getElementById("genreChips").innerHTML = html || '<span class="text-xs text-slate-400">No genres found.</span>';
    }

    function exportCsv() {
      const list = sortedGames(filteredGames());
      const headers = ["store", "id", "name", "status", "priority", "score", "playtime_hours", "hltb_main", "hltb_main_extra", "hltb_completionist", "steam_review_percent", "metacritic", "price", "discount_percent", "release_date", "genres", "notes"];
      const rows = list.map(g => {
        const p = getPersonal(g);
        const ng = normalizeGame(g);
        return [
          ng.store, ng.id, g.name, p.status, p.priority, priorityScore(g).toFixed(2), (g.playtime_minutes / 60).toFixed(1),
          hltbMain(g) ?? "", g.hltb_main_extra_hours ?? "", g.hltb_completionist_hours ?? "", g.steam_review_percent ?? "", g.metacritic_score ?? "",
          g.price ?? "", g.discount_percent ?? "", g.release_date ?? "", (g.genres || []).join("; "), p.notes
        ].map(x => `"${String(x).replace(/"/g, '""')}"`).join(",");
      });
      download("steam-backlog.csv", `${headers.join(",")}\n${rows.join("\n")}`, "text/csv");
    }

    function download(name, content, type) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([content], { type }));
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function applyMergedLibrary() {
      const parts = [];
      if (libraryMeta.steam) parts.push(`Steam ${libraryMeta.steam.game_count} (${new Date(libraryMeta.steam.fetched_at).toLocaleString()})`);
      if (libraryMeta.gog) parts.push(`GOG ${libraryMeta.gog.game_count} (${new Date(libraryMeta.gog.fetched_at).toLocaleString()})`);
      document.getElementById("meta").textContent = parts.length ? parts.join(" · ") : "No library data loaded";
      renderStoreChips();
      renderGenreChips();
      renderSummary();
      renderPicks();
      renderTable();
    }

    async function fetchLibraryJson(path) {
      const res = await fetch(`${path}?t=${Date.now()}`);
      if (!res.ok) return null;
      return res.json();
    }

    async function reloadGames() {
      const steam = await fetchLibraryJson("games_steam.json");
      const legacy = steam ? null : await fetchLibraryJson("games.json");
      const gog = await fetchLibraryJson("games_gog.json");
      const steamData = steam || legacy;
      if (!steamData && !gog) throw new Error("No library files found");
      libraryMeta.steam = steamData;
      libraryMeta.gog = gog;
      allGames = [
        ...(steamData?.games || []).map(g => normalizeGame({ ...g, store: g.store || "steam", id: g.id ?? g.appid })),
        ...(gog?.games || []).map(g => normalizeGame({ ...g, store: "gog", id: g.id ?? g.gog_id })),
      ];
      applyMergedLibrary();
    }

    function renderStoreChips() {
      document.querySelectorAll(".store-chip").forEach(chip => {
        chip.classList.toggle("active", chip.dataset.store === (prefs.storeFilter || ""));
      });
    }

    function bindEvents() {
      document.querySelectorAll("th[data-sort]").forEach(th => {
        th.addEventListener("click", () => {
          const key = th.dataset.sort;
          if (sortKey === key) sortDir *= -1;
          else { sortKey = key; sortDir = 1; }
          renderTable();
        });
      });
      ["search", "statusFilter", "unplayedOnly", "minRating", "maxHours"].forEach(id => {
        document.getElementById(id).addEventListener("input", () => {
          document.getElementById("minRatingVal").textContent = document.getElementById("minRating").value;
          const h = +document.getElementById("maxHours").value;
          document.getElementById("maxHoursVal").textContent = h >= 200 ? "200+" : h;
          renderTable();
        });
      });
      document.getElementById("genreMode").addEventListener("change", e => {
        prefs.genreFilterMode = e.target.value;
        savePrefs();
        renderTable();
      });
      document.getElementById("showScoreColumn").addEventListener("change", e => {
        prefs.showScoreColumn = e.target.checked;
        savePrefs();
        renderTable();
      });
      document.getElementById("quickWinMax").addEventListener("input", e => {
        prefs.quickWinMaxHours = +e.target.value;
        document.getElementById("quickWinMaxVal").textContent = prefs.quickWinMaxHours;
        savePrefs();
        renderPicks();
      });
      document.getElementById("togglePicks").addEventListener("click", () => {
        prefs.picksCollapsed = !prefs.picksCollapsed;
        savePrefs();
        document.getElementById("picksContainer").classList.toggle("hidden", prefs.picksCollapsed);
        document.getElementById("togglePicks").textContent = prefs.picksCollapsed ? "Show" : "Hide";
      });
      document.querySelectorAll(".pick-tab").forEach(btn => {
        btn.addEventListener("click", () => {
          prefs.picksTab = btn.dataset.tab;
          savePrefs();
          renderPicks();
        });
      });
      document.getElementById("storeChips").addEventListener("click", e => {
        const chip = e.target.closest(".store-chip");
        if (!chip) return;
        prefs.storeFilter = chip.dataset.store || "";
        savePrefs();
        renderStoreChips();
        renderTable();
      });
      document.getElementById("genreChips").addEventListener("click", e => {
        const chip = e.target.closest(".genre-chip");
        if (!chip) return;
        const genre = chip.dataset.genre;
        if (prefs.genreFilters.includes(genre)) prefs.genreFilters = prefs.genreFilters.filter(x => x !== genre);
        else prefs.genreFilters.push(genre);
        savePrefs();
        renderGenreChips();
        renderTable();
      });
      document.getElementById("tbody").addEventListener("change", e => {
        const t = e.target;
        if (!t.dataset.gameKey) return;
        const g = findGameByKey(t.dataset.gameKey);
        if (!g) return;
        setPersonal(g, t.dataset.field, t.dataset.field === "priority" ? +t.value : t.value);
        renderTable();
      });
      document.getElementById("tbody").addEventListener("blur", e => {
        const t = e.target;
        if (!t.classList.contains("notes-input")) return;
        const g = findGameByKey(t.dataset.gameKey);
        if (g) setPersonal(g, "notes", t.value);
      }, true);
      document.getElementById("tbody").addEventListener("click", e => {
        const btn = e.target.closest("[data-hltb-edit]");
        if (!btn) return;
        const g = findGameByKey(btn.dataset.hltbEdit);
        if (!g) return;
        const existing = getPersonal(g).hltb_override ?? "";
        const next = prompt("Override HLTB main hours (blank to reset):", existing);
        if (next === null) return;
        const value = String(next).trim();
        setPersonal(g, "hltb_override", value === "" ? null : Number(value));
        renderTable();
      });
      document.addEventListener("click", e => {
        const card = e.target.closest(".pick-card");
        if (card) focusGame(card.dataset.gameKey);
      });
      document.addEventListener("keydown", e => {
        if (e.key === "Escape") {
          expandedKeys = new Set();
          renderTable();
        }
      });
      document.getElementById("pickForMe").addEventListener("click", e => {
        let list = filteredGames();
        if (!e.shiftKey) list = list.filter(g => getPersonal(g).status === "backlog");
        if (!list.length) return;
        const pick = list[Math.floor(Math.random() * list.length)];
        focusGame(gameKey(pick));
      });
      document.getElementById("reloadData").addEventListener("click", async () => {
        try { await reloadGames(); } catch { alert("Could not reload library files. Use Load games.json or run the fetch scripts."); }
      });
      document.getElementById("exportCsv").addEventListener("click", exportCsv);
      document.getElementById("exportNotes").addEventListener("click", () => download("steam-backlog-notes.json", JSON.stringify(personal, null, 2), "application/json"));
      document.getElementById("importNotes").addEventListener("change", async e => {
        const file = e.target.files[0];
        if (!file) return;
        personal = { ...personal, ...JSON.parse(await file.text()) };
        savePersonal();
        renderSummary();
        renderPicks();
        renderTable();
        e.target.value = "";
      });
      document.getElementById("loadGamesFile").addEventListener("change", async e => {
        const file = e.target.files[0];
        if (!file) return;
        const data = JSON.parse(await file.text());
        if (data.store === "gog") {
          libraryMeta.gog = data;
          allGames = [
            ...allGames.filter(g => normalizeGame(g).store !== "gog"),
            ...(data.games || []).map(g => normalizeGame({ ...g, store: "gog", id: g.id ?? g.gog_id })),
          ];
        } else {
          libraryMeta.steam = data;
          allGames = [
            ...allGames.filter(g => normalizeGame(g).store !== "steam"),
            ...(data.games || []).map(g => normalizeGame({ ...g, store: g.store || "steam", id: g.id ?? g.appid })),
          ];
        }
        applyMergedLibrary();
        e.target.value = "";
      });
    }

    async function init() {
      migrateV3();
      bindEvents();
      document.getElementById("showScoreColumn").checked = !!prefs.showScoreColumn;
      document.getElementById("genreMode").value = prefs.genreFilterMode;
      document.getElementById("quickWinMax").value = prefs.quickWinMaxHours;
      document.getElementById("quickWinMaxVal").textContent = prefs.quickWinMaxHours;
      document.getElementById("picksContainer").classList.toggle("hidden", prefs.picksCollapsed);
      document.getElementById("togglePicks").textContent = prefs.picksCollapsed ? "Show" : "Hide";
      renderStoreChips();
      try {
        await reloadGames();
      } catch {
        document.getElementById("meta").innerHTML = '<span class="text-amber-400">Run <code class="bg-slate-700 px-1 rounded">python fetch_games.py</code> and/or <code class="bg-slate-700 px-1 rounded">python fetch_gog.py</code>, then reload.</span>';
      }
    }

    init();
  </script>
</body>
</html>
