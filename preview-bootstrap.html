<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Preview bootstrap</title>
</head>
<body>
  <script>
    try {
      const keys = ['steam-backlog-ui-prefs'];
      for (const key of keys) {
        const prefs = JSON.parse(localStorage.getItem(key) || '{}');
        prefs.activeView = 'dashboard';
        localStorage.setItem(key, JSON.stringify(prefs));
      }
      localStorage.setItem('baklog-color-theme', 'default');
    } catch (e) {}
    location.replace('/');
  </script>
</body>
</html>
