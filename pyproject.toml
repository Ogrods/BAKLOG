[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Only real Python packages — exclude js/, vendor/, assets/, data/, etc.
include = ["auth*", "fetchers*", "enrichers*", "shared*"]

[project]
name = "steam-backlog"
version = "0.6.0"
description = "Local multi-store game library dashboard and fetchers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "browser-cookie3>=0.20.0",
    "python-dotenv>=1.0.0",
    "websocket-client>=1.6.0",
    "keyring>=25.0.0",
    "cryptography>=42.0.0",
    "requests>=2.31.0",
    "howlongtobeatpy>=1.0.0",
    "psnawp>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: optional tests that launch a real Chrome/Edge browser",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
