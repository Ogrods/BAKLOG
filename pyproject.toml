[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Only real Python packages — exclude js/, vendor/, assets/, data/, etc.
include = ["auth*", "clients*", "fetchers*", "enrichers*", "shared*"]

[project]
name = "steam-backlog"
version = "0.8.40"
description = "Local multi-store game library dashboard and fetchers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "browser-cookie3>=0.20.0",
    "python-dotenv>=1.0.0",
    "websocket-client>=1.6.0",
    "keyring>=25.0.0",
    "cryptography>=42.0.0",
    "requests>=2.31.0",
    "howlongtobeatpy>=1.0.0",
    "psnawp>=3.0.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
# Dev/CI only — not required to run server.py or fetchers.
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pytest-sugar>=1.0",
    "ruff>=0.4",
]
# System tray launcher (tray_app.py). Optional — the server runs without it.
tray = [
    "pystray>=0.19",
    "Pillow>=12.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration and not release_smoke'"
timeout = 60
timeout_method = "thread"
faulthandler_timeout = 70
markers = [
    "integration: optional tests that launch a real Chrome/Edge browser",
    "no_leak_check: skip autouse thread/child leak detector for self-check tests",
    "slow: timing/subprocess-heavy tests (run on the dedicated Ubuntu slow lane; excluded from Windows/macOS smoke). Run locally with -m slow; skip with -m 'not slow'.",
    "release_smoke: store API contracts and fetcher regressions required before tagging a release (release.yml + test-all.ps1 -Full).",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/audit_*.py" = ["E501", "E402", "F841"]
# tool/ scripts are personal one-off debug scripts with hardcoded local paths
# and inline conditionals. Not architectural code — suppress formatting nits.
"tools/*.py" = ["E501", "E701"]
