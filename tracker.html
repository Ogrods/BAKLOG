<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BAKLOG · Project Tracker</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --bg: #0f172a;
      --bg-panel: #1e293b;
      --bg-elev: #334155;
      --bg-soft: #475569;
      --border: #334155;
      --border-soft: #475569;
      --text: #e2e8f0;
      --text-dim: #cbd5e1;
      --text-mute: #94a3b8;
      --text-faint: #64748b;
      --accent: #38bdf8;
      --accent-dim: #0284c7;
      --red: #f87171;
      --amber: #fbbf24;
      --grey: #94a3b8;
      --green: #34d399;
    }
    * { box-sizing: border-box; }
    html, body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; line-height: 1.5; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { background: var(--bg-elev); color: var(--text-dim); padding: 1px 5px; border-radius: 3px; font-size: 0.9em; font-family: "JetBrains Mono", Consolas, ui-monospace, monospace; }
    strong { color: var(--text); }
    em { color: var(--text-dim); font-style: normal; font-weight: 600; }
    h1, h2, h3, h4 { color: var(--text); margin: 0 0 0.5rem; line-height: 1.2; font-weight: 600; }
    h1 { font-size: 1.875rem; letter-spacing: 0.02em; }
    h2 { font-size: 1.25rem; margin-top: 0.5rem; }
    h3 { font-size: 1rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; margin-top: 1rem; }
    p { margin: 0 0 0.75rem; color: var(--text-dim); }
    .muted { color: var(--text-mute); }
    .faint { color: var(--text-faint); }

    .app { max-width: 1280px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }

    header.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; }
    .brand { display: flex; align-items: center; gap: 0.65rem; margin-right: 0.75rem; }
    .brand-title { font-size: 1.5rem; font-weight: 700; color: var(--accent); letter-spacing: 0.06em; }
    .brand-sub { font-size: 0.7rem; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.12em; margin-top: 0.15rem; }
    .topbar-actions { display: flex; gap: 0.5rem; margin-left: auto; }
    .btn { background: var(--bg-elev); color: var(--text-dim); border: 1px solid var(--border-soft); border-radius: 0.375rem; padding: 0.4rem 0.75rem; font-size: 0.85rem; cursor: pointer; font-family: inherit; }
    .btn:hover { background: var(--bg-soft); color: var(--text); }
    .btn-primary { background: var(--accent-dim); border-color: var(--accent); color: #f0f9ff; }
    .btn-primary:hover { background: var(--accent); color: #0c1f33; }
    .btn-danger { color: var(--red); border-color: var(--red); }
    .btn-danger:hover { background: var(--red); color: #1a0b0b; }
    .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }

    .tabbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
    .tab { background: var(--bg-panel); color: var(--text-dim); border: 1px solid var(--border-soft); padding: 0.4rem 0.85rem; border-radius: 0.375rem; font-size: 0.85rem; cursor: pointer; font-family: inherit; font-weight: 500; transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease; }
    .tab:hover { background: var(--bg-elev); color: var(--text); }
    .tab.active { background: var(--accent-dim); border-color: var(--accent); color: #f0f9ff; }

    .panel { display: none; }
    .panel.active { display: block; }

    .card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .card-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.75rem; }
    @media (max-width: 900px) { .grid-3, .grid-4, .grid-5 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .grid-2, .grid-3, .grid-4, .grid-5 { grid-template-columns: 1fr; } }

    .stat { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.85rem 1rem; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text); line-height: 1; }
    .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-mute); margin-top: 0.35rem; }
    .stat-info .stat-value { color: var(--accent); }
    .stat-success .stat-value { color: var(--green); }
    .stat-warning .stat-value { color: var(--amber); }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { text-align: left; padding: 0.55rem 0.65rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.7rem; font-weight: 600; }
    tbody tr:hover { background: rgba(56, 189, 248, 0.04); }
    td code { white-space: nowrap; }

    .pill { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid var(--border-soft); background: var(--bg-elev); color: var(--text-dim); }
    .pill-success { background: rgba(52, 211, 153, 0.12); color: var(--green); border-color: var(--green); }
    .pill-info { background: rgba(56, 189, 248, 0.12); color: var(--accent); border-color: var(--accent); }
    .pill-warning { background: rgba(251, 191, 36, 0.12); color: var(--amber); border-color: var(--amber); }
    .pill-danger { background: rgba(248, 113, 113, 0.12); color: var(--red); border-color: var(--red); }
    .pill-neutral { background: var(--bg-elev); color: var(--text-mute); border-color: var(--border-soft); }

    .sev { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.4rem; vertical-align: middle; }
    .sev-red { background: var(--red); }
    .sev-amber { background: var(--amber); }
    .sev-grey { background: var(--grey); }

    .check-row { display: flex; gap: 0.6rem; padding: 0.55rem 0.65rem; border-bottom: 1px solid var(--border); align-items: flex-start; }
    .check-row:last-child { border-bottom: none; }
    .check-row input[type="checkbox"] { margin-top: 0.25rem; cursor: pointer; accent-color: var(--accent); flex-shrink: 0; width: 1rem; height: 1rem; }
    .check-row label { cursor: pointer; flex: 1; color: var(--text-dim); font-size: 0.9rem; line-height: 1.45; }
    .check-row input[type="checkbox"]:checked + label { color: var(--text-mute); text-decoration: line-through; text-decoration-color: var(--text-faint); }

    .finding { border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.85rem 1rem; margin-bottom: 0.6rem; background: var(--bg-panel); }
    .finding-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .finding-title { font-weight: 600; color: var(--text); font-size: 0.95rem; flex: 1; min-width: 0; }
    .finding-meta { display: flex; gap: 0.35rem; flex-shrink: 0; }
    .finding-body { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 0.5rem; line-height: 1.55; }
    .finding-decide { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .finding-decide button { background: var(--bg-elev); border: 1px solid var(--border-soft); color: var(--text-mute); padding: 0.25rem 0.65rem; border-radius: 0.25rem; font-size: 0.75rem; cursor: pointer; font-family: inherit; }
    .finding-decide button:hover { background: var(--bg-soft); color: var(--text-dim); }
    .finding-decide button.accept.active { background: rgba(52, 211, 153, 0.15); border-color: var(--green); color: var(--green); }
    .finding-decide button.reject.active { background: rgba(248, 113, 113, 0.1); border-color: var(--red); color: var(--red); }
    .finding-decide button.defer.active { background: rgba(251, 191, 36, 0.12); border-color: var(--amber); color: var(--amber); }
    .finding-decide button.done.active { background: var(--green); border-color: var(--green); color: #0b1220; font-weight: 600; }
    .finding.is-done { opacity: 0.65; }
    .finding.is-done .finding-title { text-decoration: line-through; text-decoration-color: rgba(148, 163, 184, 0.45); }
    .finding-notes { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border-soft); border-radius: 0.25rem; padding: 0.35rem 0.5rem; font-size: 0.8rem; font-family: inherit; resize: vertical; min-height: 2.25rem; margin-top: 0.4rem; }
    .finding-notes:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

    details.phase { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 0.5rem; padding: 0 1rem; margin-bottom: 0.75rem; }
    details.phase[open] { padding-bottom: 0.75rem; }
    details.phase > summary { cursor: pointer; list-style: none; padding: 0.85rem 0; display: flex; align-items: center; gap: 0.75rem; }
    details.phase > summary::-webkit-details-marker { display: none; }
    details.phase > summary::after { content: "+"; margin-left: auto; color: var(--text-mute); font-size: 1.2rem; line-height: 1; }
    details.phase[open] > summary::after { content: "−"; }
    .phase-title { font-weight: 600; font-size: 1rem; color: var(--text); }
    .phase-status { display: inline-flex; gap: 0.4rem; align-items: center; color: var(--text-mute); font-size: 0.75rem; }
    .progress-bar { width: 80px; height: 4px; background: var(--bg-elev); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); transition: width 0.25s ease; }

    .callout { background: rgba(56, 189, 248, 0.08); border: 1px solid var(--accent); border-radius: 0.5rem; padding: 0.85rem 1rem; margin-bottom: 1rem; }
    .callout.success { background: rgba(52, 211, 153, 0.08); border-color: var(--green); }
    .callout.warning { background: rgba(251, 191, 36, 0.08); border-color: var(--amber); }
    .callout-title { font-weight: 600; color: var(--text); margin-bottom: 0.35rem; font-size: 0.95rem; }
    .callout .callout-body { color: var(--text-dim); font-size: 0.85rem; }

    .field-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.85rem 1rem; }
    .field-card .field-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.35rem; }
    .field-card .field-name { font-weight: 600; color: var(--text); }
    .field-card .field-body { color: var(--text-dim); font-size: 0.85rem; }

    .freenotes { width: 100%; min-height: 200px; background: var(--bg); color: var(--text); border: 1px solid var(--border-soft); border-radius: 0.375rem; padding: 0.75rem; font-family: inherit; font-size: 0.9rem; line-height: 1.5; resize: vertical; }
    .freenotes:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--bg-elev); color: var(--text); border: 1px solid var(--accent); padding: 0.65rem 1.2rem; border-radius: 0.375rem; font-size: 0.85rem; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 50; }
    .toast.show { opacity: 1; }

    svg.flow { display: block; max-width: 100%; height: auto; background: var(--bg); border-radius: 0.375rem; }

    .legend { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 0.75rem; font-size: 0.8rem; color: var(--text-mute); }
    .legend-item { display: inline-flex; align-items: center; gap: 0.4rem; }
    .legend-swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border-soft); }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="assets/baklog-logo.svg" alt="" aria-hidden="true" style="height: 36px; width: auto;" onerror="this.style.display='none'" />
        <div>
          <div class="brand-title">BAKLOG</div>
          <div class="brand-sub">Project Tracker</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-sm" id="exportBtn" title="Download tracker state as JSON">Export</button>
        <button type="button" class="btn btn-sm" id="importBtn" title="Import tracker state from JSON">Import</button>
        <input type="file" id="importFile" accept="application/json" style="display:none" />
        <button type="button" class="btn btn-sm btn-danger" id="resetAllBtn" title="Wipe all tracker state">Reset all</button>
        <a class="btn btn-sm" href="index.html" title="Back to BAKLOG dashboard">← App</a>
      </div>
    </header>

    <nav class="tabbar" id="tabbar"></nav>

    <main id="panels"></main>

    <div class="toast" id="toast"></div>
  </div>

  <script>
  "use strict";

  const STORAGE_KEY = "baklog-tracker-v1";

  // ---------- Tabs ----------
  const TABS = [
    { id: "now", label: "Now" },
    { id: "phases", label: "Phases" },
    { id: "arch", label: "Architecture" },
    { id: "pipeline", label: "Pipeline" },
    { id: "wishlist", label: "Wishlist matrix" },
    { id: "findings", label: "Audit findings" },
    { id: "blindspots", label: "Blind spots" },
    { id: "debug", label: "Debug tools" },
    { id: "monetize", label: "Monetization" },
  ];

  // ---------- Phases (checklists) ----------
  const PHASES = [
    {
      id: "p1",
      title: "Phase 1 — Stabilize (current)",
      tagline: "Initial build wrap. UI consistency. Bug triage. Feature freeze for the audit.",
      items: [
        { id: "p1_hide_dupes_consistency", label: "Hide-duplicates control: persists, visible in filter sidebar on library + wishlist, off-state recovers on refresh" },
        { id: "p1_coop_segmented", label: "Co-op filter: segmented control (Off · Any · Online · Couch · Both); dashboard drills map onto it" },
        { id: "p1_conn_howto", label: "Connections page: how-to copy block for each auth kind (browser / paste / API key / local-only)" },
        { id: "p1_conn_manual_row", label: "Connections page: manual cards collapsed into their own row so heights don't break the grid" },
        { id: "p1_dash_spotlight_flicker", label: "Dashboard spotlight stops flickering on dash→library→dash revisit (compositor layer fix)" },
        { id: "p1_dash_charts_replay", label: "Dashboard charts replay animation on revisit without rebuilding (no destroy/recreate)" },
        { id: "p1_table_virtual", label: "Library/itch table uses true viewport windowing (spacer rows + ~viewport DOM rows), back-to-top button stacked above the A–Z rail" },
        { id: "p1_table_drill", label: "Dashboard drill-in: overlay-on-drill, defer renderSummary/picks via rIC, anchor by scroll-position (no 0…N flush paint)" },
        { id: "p1_table_perf_instr", label: "Phase A perf instrumentation (?perf=1) — per-renderTable marks, chunk timings, history in window.__baklogPerf" },
        { id: "p1_feature_freeze", label: "Feature freeze declared: no new features land until the audit triage in Phase 2 is complete" },
        { id: "p1_full_backup", label: "Full project backup taken (out-of-repo snapshot folder with games_*.json + data/)" },
        { id: "p1_canvases_retired", label: "Three canvases retired; tracker.html is the single source of project truth" },
      ],
    },
    {
      id: "p2",
      title: "Phase 2 — Senior audit + refactor",
      tagline: "Triage the Audit findings tab. Each Accept becomes its own focused follow-up plan. No refactor without a triage decision.",
      items: [
        { id: "p2_triage_arch", label: "Triage architecture findings: accept/reject/defer each item in the Audit findings tab" },
        { id: "p2_triage_ux", label: "Triage UX findings: walk every view (Dashboard / Library / Wishlist / Itch / Connections) and decide per item" },
        { id: "p2_triage_debug", label: "Triage debug refactor findings: pick what's worth doing now vs. parking" },
        { id: "p2_followup_plans", label: "Each Accepted finding gets its own focused plan (small, reviewable, single concern)" },
        { id: "p2_no_bandaids", label: "Rule: no fixes during Phase 2 that aren't part of an accepted-finding follow-up plan" },
        { id: "p2_deferred_ux_surfaces", label: "Surface deferred UX audits during triage: smart-lists (find_ux_tag_smart_lists), responsiveness (find_ux_responsiveness), add-row (find_ux_add_row), remove-row (find_ux_remove_row). Tags + notes audits resolved." },
      ],
    },
    {
      id: "p3",
      title: "Phase 3 — Hardening",
      tagline: "Make it survive bad inputs, second contributors, and the first stranger who tries to install it.",
      items: [
        { id: "p3_games_backup", label: "[DONE] Rotated backups of games_*.json + itad_prices.json — shared/safe_write.py wired through fetchers/_base.py + fetch_itad.py; data/games_backups/<stem>/ keeps last 10" },
        { id: "p3_gitattributes", label: ".gitattributes file: stop the LF/CRLF warnings on every commit" },
        { id: "p3_license", label: "[DONE] LICENSE file added (MIT) — repo root + pyproject.toml + package.json + README header link" },
        { id: "p3_js_tests", label: "JS test runner (Vitest) + first tests for table-query, dedup, normalization" },
        { id: "p3_js_tests_deals", label: "Vitest: deals.js — getDealInfo ITAD-over-Steam precedence, dealLowBadgeHtml lowKind branches, dealShopShort fallback" },
        { id: "p3_js_tests_prefs", label: "Vitest: prefs.js — loadPrefs strips legacy crossStoreDedup, applySavedSortForView clamps invalid keys, viewSorts persistence" },
        { id: "p3_js_tests_fingerprint", label: "Vitest: table-ui.js tableFingerprint — differs on every input it should, identical for same input (regression magnet)" },
        { id: "p3_js_tests_dashboard_fp", label: "Vitest: dashboard.js dashboardFingerprint — qw / itch presence / dv changes trigger re-render, no-op when unchanged" },
        { id: "p3_js_tests_dedup_state", label: "Vitest: game-core.recomputeCrossStoreHidden — small state fixture; expected hidden keys match store-priority order; respects sessionPrefs.crossStoreDedup" },
        { id: "p3_ci", label: "[DONE] GitHub Actions: ruff (advisory) + Python pytest + JS vitest on push/PR to main/master — see .github/workflows/ci.yml" },
        { id: "p3_ci_ruff_required", label: "Make ruff lint a required CI gate — clean the ~150 inherited warnings (81 E501 long-line, 26 F401 unused-import, 24 UP017 datetime-timezone-utc, 14 I001 unsorted-imports, 5 UP035/UP012 modernization), flip continue-on-error→false in ci.yml" },
        { id: "p3_drill_anchor_audit", label: "Drill-in scroll audit (FULL) — unify the scroll-target story across spotlight / picks-versus / itch-hero / category drills / focusGame. Spotlight 2nd-click stays at top when picks is open, category drills land in different spots, picks-deferred reanchor only half-fixes it. See find_drill_anchor_inconsistent for repros + architectural seams." },
        { id: "p3_error_boundary", label: "[DONE] Global window.onerror + unhandledrejection handler that surfaces a toast — js/error-boundary.js, installs on app boot, top-right red sticky toast with Copy/Details/Dismiss; debug overlay shows running error count; window.__baklogErrors holds the session log" },
        { id: "p3_debug_overlay", label: "?debug=1 overlay: data version, last render ms, table fingerprint, active filter count, current view" },
        { id: "p3_fetcher_backoff", label: "Fetcher backoff: after N consecutive auth failures, the chip says 'Reconnect required' instead of retrying silently" },
        { id: "p3_readme_install", label: "README install section verified by a fresh clone on a new Windows machine" },
        { id: "p3_changelog_discipline", label: "[DONE] SemVer source-of-truth (pyproject.toml + package.json) + Release discipline block in CHANGELOG documenting the bump → rename Unreleased → tag workflow. First tag push is a user action." },
      ],
    },
    {
      id: "p4",
      title: "Phase 4 — Productize",
      tagline: "Make a new user's first 10 minutes feel inevitable. Onboarding, screenshots, hosted demo decision.",
      items: [
        { id: "p4_onboarding_flow", label: "Onboarding: empty-state UX. 'You have 0 stores connected — Start with Steam' CTA on Connections" },
        { id: "p4_readme_rewrite", label: "README rewrite: hero shot, 30-second pitch, three-step install, screenshot gallery" },
        { id: "p4_landing_page", label: "Landing page (GitHub Pages or similar): name, screenshots, ITAD-style deal radar value prop" },
        { id: "p4_hosted_demo", label: "Decide: hosted demo with stub data? Or local-only forever?" },
        { id: "p4_privacy_doc", label: "[DONE] Privacy doc — PRIVACY.md at repo root: credentials table, data files inventory, network hosts, explicit 'what does NOT happen', deletion checklist" },
        { id: "p4_cross_platform_decision", label: "Decide: stay Windows-only, or invest in macOS / Linux (Amazon SQLite paths, DPAPI alternatives)" },
        { id: "p4_packaging", label: "Decide: pip-installable? PyInstaller exe? Tauri shell? Stay 'clone and run'?" },
      ],
    },
    {
      id: "p5",
      title: "Phase 5 — Monetize / launch",
      tagline: "Pick a business shape. Pick a launch channel. Don't pick both at once.",
      items: [
        { id: "p5_pick_model", label: "Pick a model (OSS + paid hosted sync, one-time paid app, or affiliate-only). See Monetization tab" },
        { id: "p5_pick_channel", label: "Pick one launch channel (HN Show / r/patientgamers / r/Steam / Twitter / YouTube long-form) — not multiple" },
        { id: "p5_pricing", label: "Pricing decided (if paid): one number, no tiers at launch" },
        { id: "p5_soft_launch", label: "Soft launch: invite-only beta with 10–20 friends before going public" },
        { id: "p5_metrics", label: "Decide what success looks like: stars, signups, retention, MRR? Pick one north-star" },
      ],
    },
  ];

  // ---------- Findings (audit) ----------
  const FINDINGS = [
    // Architecture
    { id: "find_appjs_size", area: "Arch", severity: "grey", title: "[RESOLVED] app.js split landed — ~150-line orchestrator",
      body: "Done. js/app.js is now a thin orchestrator (~150 lines) that hydrates state, wires the downstream-sync + fetcher-health callback bags, and kicks off bootstrap + bindEvents. The heavy logic lives in focused modules: game-core, deals, genres, table-ui, table-query, picks-ui, personal-storage, filters-ui, bind-events, library-load, add-game-modal, covers, prefs. Keep this finding around as a grey breadcrumb so future contributors can find the rationale; close on next tracker prune." },
    { id: "find_dashboard_di_shim", area: "Arch", severity: "grey", title: "[RESOLVED] Runtime DI shim removed from js/dashboard.js",
      body: "Done. The c('fnName') runtime DI lookup is gone — dashboard.js and its sub-modules now use direct ES imports from game-core, deals, genres, personal-storage, prefs, filters-ui, table-ui. Pairs with the dashboard split (find_dashboard_size)." },
    { id: "find_dashboard_size", area: "Arch", severity: "grey", title: "[RESOLVED] dashboard.js split into 6 focused modules",
      body: "Done. dashboard.js is now ~280-line orchestrator + re-exports. The 2.3k-line monolith was split into dashboard-charts (Chart.js, scatter, era bands), dashboard-cards (coop, picks-versus, wishlist stats, itch), dashboard-insights (insight marquee), dashboard-spotlight (rotating hero), dashboard-drilldown (dash* drill helpers), dashboard-shared (constants + animateCount + dashboardLibraryGames)." },
    { id: "find_dedup_pref_force", area: "Arch", severity: "grey", title: "[RESOLVED] Session-prefs concept introduced — crossStoreDedup migrated",
      body: "Done. Added state.sessionPrefs (state.js) + loadSessionPrefs() (prefs.js) for toggles that should never persist across reloads. crossStoreDedup moved out of the localStorage prefs bag entirely — defaults to true via loadSessionPrefs() on every bootstrap, off-state lasts only the current tab/session. Removed the force-overwrite in app.js (was `state.prefs.crossStoreDedup = true`), the savePrefs() in the toggle handler (bind-events.js) and pill clear (filters-ui.js), and stripped crossStoreDedup from the prefs fallback. loadPrefs() also `delete merged.crossStoreDedup` so old persisted values are dropped on read. tableFingerprint reads state.sessionPrefs.crossStoreDedup so the table cache still invalidates when the toggle flips. Pattern is now reusable: any future session-scoped toggle goes into state.sessionPrefs / loadSessionPrefs() with no other ceremony." },
    { id: "find_crlf", area: "Arch", severity: "grey", title: "[RESOLVED] .gitattributes — LF in repo, CRLF for .bat/.ps1",
      body: "Done. Root .gitattributes: * text=auto eol=lf for source (js/py/html/css/json/md/svg/etc.), eol=crlf for *.bat/*.cmd/*.ps1, binary for images/fonts/archives. Stops the per-commit LF/CRLF warning noise on Windows. One-time: if files were already committed with mixed endings, run `git add --renormalize .` then commit so the index matches." },
    { id: "find_no_js_tests", area: "Arch", severity: "amber", title: "JS test coverage — first 59 tests landed (Vitest)",
      body: "First pass done. Vitest 3 + happy-dom (lighter than jsdom; needed because personal-store.js touches window.addEventListener at module scope). 59 passing tests across tests/table-query.test.js (filter/sort + coop + early-access + key + hidden-key dedup integration), tests/game-core.test.js (normalizeNameForDedup, scoreEntry, storePriority, isJunkEntry, dedupeWithinStore, normalizeGame, gameKey, alphaBucket, formatHours, formatReleaseDate), and the pre-existing tests/fetcher-health.test.js. Config: vitest.config.js (env: happy-dom, include: tests/**/*.test.js). Run via `npm test` or `npm run test:js:watch`. Still open: deals.js (getDealInfo, dealLowBadge), prefs.js (loadPrefs strips legacy crossStoreDedup, viewSorts coercion), dashboard fingerprint, table-perf snapshots. Severity dropped from amber to grey-amber — infrastructure is now in place, just needs more cases as we find bug-magnet areas." },
    { id: "find_no_ci", area: "Arch", severity: "grey", title: "[RESOLVED] CI wired up via GitHub Actions",
      body: "Done. .github/workflows/ci.yml runs on every push + PR to main/master with two parallel jobs: (1) Python 3.11 — `pip install -e .[dev]`, ruff lint (currently advisory via continue-on-error so the ~150 inherited warnings don't block the first green run), then `pytest -q` (112 tests); (2) Node 20 — `npm ci` + `npm test` (59 vitest tests). Concurrency group cancels stale runs on the same branch/PR. Follow-up p3_ci_ruff_required tracks tightening lint once the existing warnings are cleaned up." },
    { id: "find_games_no_backup", area: "Arch", severity: "grey", title: "[RESOLVED] games_*.json + itad_prices.json now atomic-write + rotated backup",
      body: "Done. New shared/safe_write.py generalizes the data/personal.json pattern (atomic temp + os.replace, plus a rolling N-deep backup directory). Plumbed through fetchers/_base.py::write_games_json (covers every fetch_*.py + every refresh) and fetch_itad.py. Backups land in data/games_backups/<stem>/<stem>-YYYYMMDD-HHMMSS-mmm.json, keep=10 by default (configurable). data/ is already in .gitignore so backups stay local. Millisecond-resolution stamps avoid same-second collisions. 9 new tests in tests/test_safe_write.py cover atomic create/replace, tmp cleanup on failure, no-op when source missing, rotation, prune-to-keep, and default prefix=stem behavior." },
    { id: "find_state_dom_split", area: "Arch", severity: "grey", title: "[RESOLVED] Filter state is now state.sessionPrefs; DOM mirrors state",
      body: "Done. The 6 live-filter controls (search, statusFilter, unplayedOnly, earlyAccessOnly, minRating, maxHours) now live in state.sessionPrefs — the same session-scoped pattern as crossStoreDedup and itchHideNonGames. collectTableParams(sessionPrefs) takes prefs as a parameter so the worker import graph stays DOM-free. New prefs.js::syncFilterDomFromState() helper pushes state into the visible controls (used by drill-ins, pill removal, clear-all, and the wishlist switchView reset). Every DOM read of those 6 ids has been replaced: bind-events.js (main input handler + status chip click + wishlist reset + tbody sort guard), filters-ui.js (collectActiveFilters, removeActiveFilter, clearAllFilters, switchView, renderSummary), dashboard-drilldown.js (dashResetLibraryFiltersExceptDedup + every dashDrill* writer), game-core.js renderStatusChipsHtml, table-ui.js tableFingerprint. Boot path calls syncFilterDomFromState() so the controls match the freshly-loaded session defaults. 4 new Vitest tests in tests/table-query.test.js cover collectTableParams(sessionPrefs): empty/missing args → defaults, full prefs → expected shape, stringy slider values → coerced to numbers. Net effect: a regression where a filter changes but its DOM input doesn't (or vice versa) is now structurally impossible." },
    { id: "find_prefs_quartet", area: "Arch", severity: "grey", title: "[RESOLVED] applyPrefsChange(patch, options) helper added; quartet sites migrated",
      body: "Done. New filters-ui.js::applyPrefsChange(patch, options) consolidates the savePrefs + syncFilterDomFromState + recomputeCrossStoreHidden + renderSummary + refreshFilterUI dance into one call. Patch shape: { prefs?, sessionPrefs? } shallow-merged into state.prefs / state.sessionPrefs. Options: { recomputeDedup, refresh, debounced, refreshOptions, renderers, skipDomSync, persist }. Behaviour: persistent prefs auto-savePrefs() when patch.prefs present; session prefs auto-syncFilterDomFromState() unless skipDomSync; recomputeDedup runs recomputeCrossStoreHidden + renderSummary before the refresh; renderers run before the refresh (errors caught + warned).\n\nMigrated sites: filters-ui.js::removeActiveFilter (huge switch — 25 cases collapsed to one-liners each), filters-ui.js::clearAllFilters (single call replaces 25 lines), bind-events.js (bindDealCheckbox factory, dealMinDiscount slider, dealMaxPrice slider, resetDealFiltersBtn, genreMode, wishlistStoreChips, summary status/store/deal chips, summary-wishlist-reset, crossStoreDedup toggle, genreChips, tagChips, tagFilterMode). Dropped now-dead imports of recomputeCrossStoreHidden, syncFilterDomFromState from bind-events.js.\n\nLeft alone: the 6 sessionPref input handler (already minimal — DOM-already-synced path), picks/score-column toggles (toggle a class or render picks, different concern), dashboard-drilldown.js (reset-then-route around switchView is a different shape — has its own dashFinishDrillToLibrary consolidation already). Lives in filters-ui.js (not prefs.js) to avoid a circular import; every dependency was already imported there.\n\nFollow-up not done: a Vitest test for applyPrefsChange — would require mocking the filters-ui import tree (table-ui, dashboard, picks-ui) which is out of scope. The 63 existing tests still pass after the migration." },
    { id: "find_drill_anchor_inconsistent", area: "Arch", severity: "amber", title: "Drill-in anchoring — unified pendingScrollTarget landed (verify spotlight repeat)",
      body: "Partial fix 2026-06-01. Replaced four overlapping scroll paths (paintTableBody pre-picks scrollTop, consumePendingFocus→requestScrollToIndex, finishDrillScroll 2-rAF, deferChrome reanchorPickedRow) with one pendingScrollTarget descriptor in table-ui.js: setPendingScrollTarget / consumePendingScrollTarget / scheduleScrollAfterLayoutSettled. Row drills (focusGame) defer scroll until after deferChrome paints picks+summary when picks is open or view is crossing; category drills (dashDrill*) set kind=toolbar and consume after refreshFilterUI layout settles. paintTableBody no longer scrolls on anchor — only paints the virtual window. Removed state._anchorScrollHandled. 4 Vitest cases in tests/drill-anchor.test.js cover toolbar vs row consumption and single-fire semantics.\n\nStill open until user verifies: (A) spotlight 2nd-click with picks open — may also involve spotlight innerHTML rotation in dashboard-spotlight.js; (C) spotlight-only vs other dash-list-jump targets. Acceptance criteria 2–3 (Nth invocation + picks expanded/collapsed integration test with full renderTable mock) not yet covered." },

    // UX
    { id: "find_ux_dash_rotation", area: "UX", severity: "grey", title: "Dashboard spotlight rotation may be calmer-off",
      body: "7-second auto-rotate competes with the rest of the page. Consider letting it stay fixed unless the user hovers/clicks (already the hover-pause case)." },
    { id: "find_ux_library_focus", area: "UX", severity: "grey", title: "[REJECTED] Library has no clear primary affordance",
      body: "Rejected by owner. Library is designed to combine multiple-store libraries and offer browse/filter/sort; the 'what to play next' job is owned by the Dashboard (spotlight + picks-versus + insights). The competing affordances (A–Z, filter drawer, summary chips, picks, sort headers) are intentional surface area, not noise to collapse into a single hero." },
    { id: "find_ux_wishlist_stack", area: "UX", severity: "grey", title: "Wishlist deal hero + sale scoreboard + steals waiting feels like three deal cards",
      body: "Each card is useful; together they're noisy. Consider collapsing into a single 'Deals' module when wishlist < 10 items, or rotating between them on a single hero card. A unified 2-column 'Deal radar' was prototyped on 2026-06-01 and reverted — keeping three cards for now while other UX work continues; revisit once the broader UX phase starts." },
    { id: "find_ux_itch_empty", area: "UX", severity: "grey", title: "Itch.io empty states are rough when filters bite",
      body: "1,047 keys → 163 games default-filtered is fine. But when you stack genre + status + min-rating filters, you hit a blank wall with no 'relax this filter' affordance." },
    { id: "find_ux_conn_density", area: "UX", severity: "amber", title: "Connections page is dense for first-run users",
      body: "Partially addressed 2026-06-01: rebuilt as master-detail (sticky left rail + static right pane in #connLayout / #connRail / #connPane in index.html; CSS grid 260px + 1fr in app.css; logic + RAIL_ORDER in js/connections.js). Steam is pinned at the top of the rail; other providers ordered by friction/pairing. Replaced the accordion/grid that caused layout bounces and overlapping eyebrow/collapse buttons. Keyboard navigation lives on the rail (handleLayoutKeydown). Still open: a first-run 'You have 0 stores connected — start with Steam' empty-state CTA (the new layout makes Steam obvious but doesn't yet tell new users 'click here first'). Followup tracked by p4_onboarding_flow." },
    { id: "find_ux_tags_unaudited", area: "UX", severity: "grey", title: "[REMOVED] Personal tags feature removed end-to-end",
      body: "Personal tags retired 2026-06-01. The earlier audit shipped canonical cross-store tags / drawer chip filter / row pill / pick-card chips / tag-only export, but the feature added bulk and friction without enough payoff over the existing genre filter + free-text notes. Surgical rip-out: deleted js/tag-filter.js; stripped tag IO from personal-storage.js (added one-shot stripLegacyTags() that drops the legacy `tags` field + tagFilters/tagFilterMode prefs, idempotent via __tags_removed_v1); removed renderTagChips / addTagBtn / per-row tag chips / tag-manage menu from filters-ui + bind-events + table-ui + index.html + app.css; pulled tagFilters/tagFilterMode from prefs.js, dashboard-drilldown, and tableFingerprint; dropped the `tags` CSV column and the Export-tags-only kebab item; updated search placeholder to 'Search games or notes'; cleaned the personal-storage + table-query tests. Notes UX (find_ux_notes_unaudited / find_ux_notes_cross_store) and orphan cleanup (find_data_orphan_personal) still in place." },
    { id: "find_ux_tag_smart_lists", area: "UX", severity: "grey", title: "[REMOVED] Tag-based smart-lists no longer applicable",
      body: "Was parked behind the tags audit. Personal tags are gone (see find_ux_tags_unaudited [REMOVED]), so a tag-based smart-list system has nothing to bind to. Genre + status + free-text notes search cover the surviving filter use cases." },
    { id: "find_ux_notes_unaudited", area: "UX", severity: "grey", title: "[RESOLVED] Per-game notes surface is unaudited end-to-end",
      body: "Resolved 2026-06-01. Inline single-line Notes column kept as the only editor. Shipped: main search matches name OR notes OR tags (placeholder updated); sky-blue '✎ note' pill in the row meta line (tooltip preview, click focuses Notes input); Esc reverts unsaved note edits; duplicate blur save removed; Export personal data (full state.personal) + Export notes only (slim {key,name,notes}); Import personal data uses mergeImportedPersonal (per-key deep merge, tag union, notes reconcile across title groups). Cross-store notes mirror via find_ux_notes_cross_store. Tests: table-query search-by-notes/tags + personal-storage merge/setPersonal. Still deferred: multiline editor, notes on picks/dashboard cards, notes undo, bulk notes edit." },
    { id: "find_data_orphan_personal", area: "Data", severity: "grey", title: "[RESOLVED] Orphan personal keys are now discoverable and prunable",
      body: "Resolved 2026-06-01. Personal records whose game no longer appears in any loaded catalog (uninstalled, store disconnected, fetcher didn't run yet) were invisible — they rode along in export and never paint a row. Shipped: findOrphanPersonalKeys() + countOrphanPersonalKeys() detector + prunePersonalKeys() in personal-storage.js, ?debug=1 overlay 'orphans' row (waits until dashboardDataReady so a partial library load doesn't lie), and a kebab → 'Clean up unknown games…' modal (js/orphan-prune.js + #orphanPruneModal). Modal lists each orphan with status / tag count / notes preview, defaults to selecting empty-only entries, has Select all/none + 'only empty entries' filter, and confirms before delete. Recoverability story: the server already writes rotating backups to data/personal_backups/ on every PUT, so a wrong delete can be restored. Auto-prune is intentionally NOT implemented — a temporarily missing games_*.json would silently flag valid data as orphan. Tests: findOrphanPersonalKeys + countOrphanPersonalKeys + prunePersonalKeys in personal-storage.test.js." },
    { id: "find_ux_notes_cross_store", area: "UX", severity: "grey", title: "[RESOLVED] Notes mirror across same-title store copies",
      body: "Resolved 2026-06-01. setPersonal(g, 'notes', …) mirrors to every getSameTitleKeys(g) copy (last-write-wins). One-shot canonicalizeNotesAcrossTitles() on library load (__notes_canonicalized_v1) runs reconcileNotesAcrossTitles(): longest non-empty note per title group wins and is written to all store keys. mergeImportedPersonal calls reconcileNotesAcrossTitles() after per-key merge so imports with split notes collapse correctly. Tests in personal-storage.test.js." },
    { id: "find_ux_responsiveness", area: "UX", severity: "amber", title: "[DEFERRED] Responsiveness / mobile + narrow-viewport pass not done",
      body: "Parked. The whole UI assumes a wide desktop viewport. Dashboard chart cards, picks grid, table layout, filter drawer, kebab menu, and the deal cards have not been audited at <1024px / <768px / <480px. No deliberate mobile story, no print stylesheet. Pick up after the major UX phase decisions land so we don't restyle twice." },
    { id: "find_ux_add_row", area: "UX", severity: "grey", title: "[RESOLVED] Add/remove unified model — custom add + duplicate warning",
      body: "Resolved 2026-06-01. Custom rows (manual[]) and Pulled (fetcher) rows now have distinct semantics. Add-game modal dedupes by normalized title against the target view (library / wishlist / itch — itch sourcing added during audit) with Go to existing / Add anyway / Cancel actions. Duplicate match excludes hidden by default (`findDuplicateMatch(title, view, { includeHidden? })`); Go to existing re-runs the lookup with includeHidden and auto-unhides the match before flashGameRow() so the user lands on the row even if they previously hid it. _bypassFor is scoped to a single proceed fn (not a sticky boolean) and resets on every titleEl input — fixes a bypass-leak where Add anyway → quickly retry with a new title skipped the warning. Custom badge (dashed outline via .store-badge.manual) shows on library + wishlist + itch rows. Add-modal footer reflects server sync; modal title/hint react to addGameTarget = 'wishlist' | 'itch' | 'library'. Tests in tests/game-duplicate.test.js (default-excludes-hidden, includeHidden opt-in, itch view sources state.itchGames)." },
    { id: "find_ux_remove_row", area: "UX", severity: "grey", title: "[RESOLVED] Add/remove unified model — bulk Remove branches by source",
      body: "Resolved 2026-06-01. Bulk Remove: custom → delete from manual[] AND clear state.personal[key] (no more orphan status/notes); pulled → personal.hidden=true (survives re-fetch). 12s undo restores both (manual array entries via saveManualGames+restoreRemoveSnapshot — preserves the un-removed manual[] entries' positions — and personal records via restorePersonalFromSnapshot). Hidden games kebab panel: per-row Restore + Restore all, both wrapped in pushPersonalUndo for symmetric 12s undo. Orphan keys (catalog row dropped after a fetcher purge) still render in the panel with a fallback {name, store} pulled from js/hidden-defaults.js's PRE_HIDDEN_BY_KEY map and an 'awaiting next fetch' tag. findOrphanPersonalKeys treats hidden=true as hasData so the cleanup modal won't silently bulk-prune a hidden delisted game. Hidden-aware stats: filterOutHidden() in picks-ui (visibleLibrary + visibleItch) + filters-ui renderSummary visible + dashboard-shared dashboardLibraryGames + filters-ui exportTopBacklogMarkdown; row-count denominators in formatRowCountText subtract countUserHiddenLibrary()/countUserHiddenWishlist(). getPersonal() rewritten to return a normalized derived object instead of mutating the stored entry on read. Pre-hide registry (js/hidden-defaults.js + seedPreHiddenDefaults gated by __pre_hidden_v1_seeded) replaces the fetch_epic.py DENYLIST and fetch_psn.py DENYLIST_IDS — 13 entries (Epic Q.U.B.E. 2 cosmetics + Death Stranding DLC, PSN streaming apps + NieR demo) are pre-hidden on first run and recoverable from the kebab panel instead of needing a Python edit. Cleanup mode still sets Skip only. Tests: tests/personal-hidden.test.js (wishlist/itch hidden filter, getPersonal purity, orphan hasData), tests/pre-hidden.test.js (idempotent seed), tests/hidden-panel.test.js (orphan fallback), tests/bulk-remove.test.js (custom row + personal entry both removed)." },

    // Debug refactor
    { id: "find_dbg_dom_truth", area: "Debug", severity: "grey", title: "[RESOLVED] collectTableParams reads from state, not DOM",
      body: "Resolved alongside find_state_dom_split. collectTableParams(sessionPrefs) is now pure (no DOM access). The 6 live filter controls live in state.sessionPrefs; DOM is a mirror. See find_state_dom_split for the full sweep details and test coverage." },
    { id: "find_dbg_apply_helper", area: "Debug", severity: "grey", title: "[RESOLVED] applyPrefsChange(patch) helper landed — see find_prefs_quartet",
      body: "Same as the architecture finding from the other angle. Every checkbox/slider event handler shrinks to one line. Stops the 'forgot to call recomputeCrossStoreHidden' family of bugs." },
    { id: "find_dbg_overlay", area: "Debug", severity: "grey", title: "[RESOLVED] ?debug=1 overlay for runtime introspection",
      body: "Done. New module js/debug-overlay.js with isDebugEnabled() (checks ?debug=1 OR localStorage 'baklog-debug=1') + startDebugOverlay() that mounts a tiny fixed-position panel (bottom-right) and polls state every 500ms. Shows: current view, _dataVersion, visible row count, active filter count, tableFingerprint (truncated, full string in tooltip), last renderTable totalMs (from window.__baklogPerf.last). Polling instead of hooking every mutation site keeps it durable as new code paths land — overlay is opt-in so the cost only applies to debug sessions. Includes an × close button (per-session hide), and styling in app.css under '.baklog-debug-overlay*'. Wired into app.js bootstrap after the initial chrome paint. Reuses the existing tableFingerprint + collectActiveFilters exports — no new state surface." },
    { id: "find_dbg_error_handler", area: "Debug", severity: "grey", title: "[RESOLVED] Global error handler that surfaces, not silences",
      body: "Done. js/error-boundary.js wires window.error + unhandledrejection listeners (installed at the very top of app.js before any other module-level code runs). Captures uncaught throws AND rejected promises that nobody caught, dedupes rapid-fire repeats with a 2-second window per signature (so a render loop firing 1000 of the same error produces one toast), keeps a rolling 50-entry session log on window.__baklogErrors, and surfaces a sticky red toast top-right with the latest message + source/line + an error count + Copy (clipboard JSON) / Details (expand stack inline) / Dismiss buttons. Never auto-dismisses (errors are not ephemeral). Debug overlay surfaces the running count in its errors field. Also exports reportError(err, opts) for opt-in try/catch sites that want to log without rethrowing." },
    { id: "find_perf_row_paint_chug", area: "Debug", severity: "grey", title: "[RESOLVED] Library row paint — viewport windowing + drill-in overlay shipped",
      body: "Done across three phases. Phase A (table-perf.js): opt-in instrumentation via ?perf=1, per-renderTable marks (query / chrome / paint / post), chunk samples in window.__baklogPerf. Phase B / B+: removed anchor-sync (no more painting 0…anchorIndex sync), added _pendingScroll + requestScrollToIndex, drill-in loading overlay that survives until the row centers, refreshFilterUI({ drillIn }) defers renderSummary + renderPicks to requestIdleCallback, updateViewChrome skips its own renderSummary on drill. Phase C: true viewport windowing — usesVirtualScroll() for >50 rows, paintVirtualSlice() keeps only ~viewport + 10 overscan rows in the DOM, top/bottom spacer <tr>s preserve total scroll height (ROW_HEIGHT=76 must match .games-table tbody tr in app.css), scheduleVirtualScrollUpdate() repaints on scroll/resize via rAF, drill / A–Z / keyboard scroll by index→pixel offset and paint the window around that row, syncCoverFits deferred to requestIdleCallback. Back-to-top now snaps instant (smooth scroll through 1700+ fixed rows was the source of the 3s freeze) and stacks above the A–Z rail. Open polish: (a) updateRowInPlace edits to off-window rows are silently dropped — pre-existing tradeoff, document or solve later; (b) tag-chip batch refresh still per-row; (c) measure query:filter-sort at 1711 rows if drill ever feels slow again." },
    { id: "find_virtual_window_cache_stale", area: "Debug", severity: "grey", title: "[RESOLVED] Virtual window early-return ignored list identity — column header sort silently no-op'd",
      body: "User-reported regression on 2026-06-01: 'row headers are not sorting — i see the event fire in console on click but this seems very broken'. Diagnosis: column header click → state.sortKey/sortDir flipped → renderTable() fired → fingerprint changed → query cache missed → queryGamesAsync returned a freshly-sorted list (correctly). The bug lived in paintVirtualSlice: the early-return guard checked (_virtualWindow.start === start && _virtualWindow.end === end && tbody has rows) without comparing the underlying list reference. After a resort the visible window is still indices 0..N — guard passes, paint short-circuits, DOM keeps the pre-sort rows. Originally the guard was meant to skip redundant repaints when scroll handlers asked for the same window; it never accounted for the list under those indices being swapped.\n\nFix: added a module-scope _virtualWindowList = null tracker. paintVirtualSlice now writes _virtualWindowList = list whenever it actually paints, and the early-return requires _virtualWindowList === list. All three reset sites (invalidateTableCache, empty-list branch, one-shot branch in paintTableBody) clear _virtualWindowList to null so the next paint always renders. Small lists (<virtual threshold) and one-shot paints were never affected — only the virtual code path.\n\nLesson for the audit: any rendering optimization that key's on 'where' (indices, scroll position, viewport range) without also keying on 'what' (the data being rendered) is a regression magnet. paintVirtualSlice was the obvious one; sweep similar guards in table-ui (consumePendingFocus, _pendingScroll re-use), dashboard.js dashboardFingerprint, and the alpha-nav letter set caching when this finding gets full-audited." },
  ];

  // ---------- Blind spots ----------
  const BLINDSPOTS = [
    { id: "bs_license", title: "[RESOLVED] LICENSE file added (MIT)", body: "Resolved 2026-06-01. Repo-root LICENSE file (MIT, © 2026 Dan Ogonoski). Mirrored in pyproject.toml ([project].license = { file = \"LICENSE\" }) and package.json (\"license\": \"MIT\"). README header links to it. Pairs with bs_semver — the version + license combo is the minimum contract a second installer needs." },
    { id: "bs_privacy", title: "[RESOLVED] PRIVACY.md added", body: "Resolved 2026-06-01. Repo-root PRIVACY.md documents: TL;DR (local-only, no servers), credentials table (where each cookie / OAuth token / API key lives — .env, OS keychain via keyring, DPAPI blob, Playwright user-data dirs), data files (games_*.json, itad_prices.json, data/personal.json + backups, manualGames), every storefront/enrichment host BAKLOG talks to, explicit 'what does NOT happen' list (no telemetry, no third-party scripts, no project cloud), and a deletion checklist. README header links to it next to the license badge." },
    { id: "bs_xplatform", title: "Cross-platform: Windows-only by accident", body: "DPAPI for secret storage, .ps1 refresh script, Amazon Games local SQLite path. macOS / Linux users hit walls. Either invest, or put a 'Windows-only for now' line at the top of the README before someone tries." },
    { id: "bs_tos", title: "Storefront scraping has TOS exposure once productized", body: "Scraping store.ubisoft.com SSR HTML and Epic storefront GraphQL is fine for personal use. The moment money or a hosted variant enters the picture, the legal posture changes. Worth knowing now, not later." },
    { id: "bs_multiuser", title: "Multi-account assumed away", body: "One Steam ID, one PSN account, one Epic. Anyone with a household-shared library, multiple regions, or a 'work vs. play' split needs a profile concept. Productizing forces this." },
    { id: "bs_i18n", title: "Internationalization / currency", body: "ITAD returns USD-shaped data; the dashboard hardcodes '$'. Anyone outside USD sees wrong-looking prices." },
    { id: "bs_a11y", title: "Accessibility has not been audited", body: "Keyboard shortcuts exist; ARIA, focus management, screen reader story are untested. Easy to get wrong; cheap to fix early." },
    { id: "bs_perf_budget", title: "No performance budget", body: "App is fast enough on your machine. A productized version needs measurements: cold load ms, time-to-interactive, bundle size, memory ceiling with N games." },
    { id: "bs_fetcher_backoff", title: "No exponential backoff on failing fetchers", body: "auth/runner.py watchdog + taskkill /F handles silent hangs. Nothing handles 'this fetcher has failed 3 times today, stop nagging me and surface a Reconnect button'." },

  // ---------- State (localStorage) ----------
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      if (!parsed || parsed.v !== 1) return defaultState();
      return parsed;
    } catch {
      return defaultState();
    }
  }
  function defaultState() {
    return { v: 1, items: {}, decisions: {}, pageNotes: {}, activeTab: "now" };
  }
  let state = loadState();
  function saveState() {
    try {
      state.ts = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      console.warn("[tracker] save failed", err);
    }
  }
  function setItem(id, checked) { state.items[id] = { checked: !!checked }; saveState(); }
  function getItem(id) { return state.items[id]?.checked === true; }
  function setDecision(id, decision) {
    const cur = state.decisions[id] || {};
    state.decisions[id] = { ...cur, decision };
    saveState();
  }
  function setDecisionNote(id, notes) {
    const cur = state.decisions[id] || {};
    state.decisions[id] = { ...cur, notes };
    saveState();
  }
  function getDecision(id) { return state.decisions[id] || {}; }
  function setPageNote(key, value) { state.pageNotes[key] = value; saveState(); }
  function getPageNote(key) { return state.pageNotes[key] || ""; }

  // ---------- DOM helpers ----------
  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v;
      else if (k === "html") node.innerHTML = v;
      else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v !== undefined && v !== null) node.setAttribute(k, v);
    }
    for (const c of children) {
      if (c == null) continue;
      if (Array.isArray(c)) c.forEach((x) => node.appendChild(x.nodeType ? x : document.createTextNode(String(x))));
      else node.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
    }
    return node;
  }
  function escapeHtml(s) {
    return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._tid);
    t._tid = setTimeout(() => t.classList.remove("show"), 1800);
  }

  function renderTabBar() {
    const bar = document.getElementById("tabbar");
    bar.innerHTML = "";

      const b = el("button", { type: "button", class: "tab" + (t.id === state.activeTab ? " active" : ""), "data-tab": t.id, onClick: () => activateTab(t.id) }, t.label);
      bar.appendChild(b);
    }
  }
  function activateTab(id) {
    state.activeTab = id;
    saveState();
    renderTabBar();
    document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === "panel-" + id));
  }

  // ---------- Checkbox row ----------
  function checkboxRow(id, label) {
    const cb = el("input", { type: "checkbox", id });
    cb.checked = getItem(id);
    cb.addEventListener("change", () => setItem(id, cb.checked));
    return el("div", { class: "check-row" }, cb, el("label", { for: id, html: label }));
  }

  // ---------- Render: Findings ----------
  function findingBlock(f) {
    const dec = getDecision(f.id);
    const wrap = el("div", { class: "finding" + (dec.decision === "done" ? " is-done" : "") });
    wrap.appendChild(el("div", { class: "finding-head" },
      el("div", { class: "finding-title" }, el("span", { class: "sev sev-" + f.severity }), f.title),
      el("div", { class: "finding-meta" },
        el("span", { class: "pill pill-neutral" }, f.area),
        el("span", { class: "pill pill-" + (f.severity === "red" ? "danger" : f.severity === "amber" ? "warning" : "neutral") }, f.severity.toUpperCase()),
      ),
    ));
    wrap.appendChild(el("div", { class: "finding-body" }, f.body));
    const decide = el("div", { class: "finding-decide" });
    const makeBtn = (label, value, cls) => {
      const b = el("button", { type: "button", class: cls + (dec.decision === value ? " active" : "") }, label);
      b.addEventListener("click", () => { setDecision(f.id, dec.decision === value ? null : value); renderActive(); });
      return b;
    };
    decide.appendChild(makeBtn("Accept", "accept", "accept"));
    decide.appendChild(makeBtn("Defer", "defer", "defer"));
    decide.appendChild(makeBtn("Reject", "reject", "reject"));
    decide.appendChild(makeBtn("Done", "done", "done"));
    wrap.appendChild(decide);
    const notes = el("textarea", { class: "finding-notes", placeholder: "Notes…" });
    notes.value = dec.notes || "";
    notes.addEventListener("input", () => setDecisionNote(f.id, notes.value));
    wrap.appendChild(notes);
    return wrap;
  }

  function panelFindings() {
    const groups = {
      Arch: FINDINGS.filter((f) => f.area === "Arch"),
      UX: FINDINGS.filter((f) => f.area === "UX"),
      Debug: FINDINGS.filter((f) => f.area === "Debug"),
    };
    const findingIds = new Set(FINDINGS.map((f) => f.id));
    const findingDecisions = Object.entries(state.decisions).filter(([id]) => findingIds.has(id)).map(([, d]) => d);
    const triaged = findingDecisions.filter((d) => d.decision === "accept" || d.decision === "reject" || d.decision === "defer" || d.decision === "done").length;
    const doneCount = findingDecisions.filter((d) => d.decision === "done").length;
    return el("section", { id: "panel-findings", class: "panel" + (state.activeTab === "findings" ? " active" : "") },
      el("div", { class: "card-row" },
        el("h1", {}, "Audit findings"),
        el("span", { class: "pill pill-info" }, `${triaged} / ${FINDINGS.length} triaged`),
        el("span", { class: "pill pill-success" }, `${doneCount} done`),
      ),
      el("p", {}, "First-pass senior-eye findings. Each item gets one of four calls: ", el("strong", {}, "Accept"), " (worth a focused follow-up plan), ", el("strong", {}, "Defer"), " (later, not now), ", el("strong", {}, "Reject"), " (won't do — explain why in notes), ", el("strong", {}, "Done"), " (shipped — clears the card)."),

  // ---------- Export / Import / Reset ----------
  function exportState() {
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().replace(/[:.]/g, "-").replace("T", "_").slice(0, 19);
    a.href = url;
    a.download = `baklog-tracker-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast("Exported.");
  }

  function importStateFromText(text) {
    try {
      const parsed = JSON.parse(text);
      if (!parsed || typeof parsed !== "object") throw new Error("not an object");
      if (parsed.v !== 1) throw new Error("unknown version " + parsed.v);
      state = { ...defaultState(), ...parsed };
      saveState();
      renderActive();
      toast("Imported.");
    } catch (err) {
      toast("Import failed: " + err.message);
    }
  }

  function resetAll() {
    if (!confirm("Wipe ALL tracker state? This clears every checkbox, decision, and note. Cannot be undone (export first if unsure).")) return;
    state = defaultState();
    saveState();
    renderActive();
    toast("Reset.");
  }

  // ---------- Wire up ----------
  document.addEventListener("DOMContentLoaded", () => {
    renderTabBar();
    renderActive();
    document.getElementById("exportBtn").addEventListener("click", exportState);
    document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
    document.getElementById("importFile").addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => importStateFromText(String(reader.result || ""));
      reader.readAsText(file);
      e.target.value = "";
    });
    document.getElementById("resetAllBtn").addEventListener("click", resetAll);
  });
