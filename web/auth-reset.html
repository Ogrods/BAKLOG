<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAKLOG - reset password</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: "DM Sans", system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
    }
    main { max-width: 32rem; width: 100%; }
    h1 {
      margin: 0 0 0.5rem;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    p { margin: 0 0 1rem; color: #94a3b8; line-height: 1.6; }
    label { display: block; text-align: left; margin: 0 0 0.35rem; font-size: 0.9rem; color: #cbd5e1; }
    input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      margin-bottom: 0.85rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font: inherit;
    }
    input:focus { outline: 2px solid #38bdf8; border-color: #38bdf8; }
    .error { color: #fca5a5; }
    .success { color: #86efac; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-top: 1.25rem; }
    a, button {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      border-radius: 0.5rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font: inherit;
    }
    .primary { background: #38bdf8; color: #0f172a; width: 100%; }
    .primary:hover { background: #7dd3fc; }
    .primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .ghost { background: transparent; color: #38bdf8; border: 1px solid #38bdf8; }
    .ghost:hover { background: rgba(56, 189, 248, 0.12); }
    .hidden { display: none; }
    form { text-align: left; margin-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>BAKLOG</h1>
    <p id="lead">Loading…</p>
    <p id="hint" class="hidden"></p>
    <p id="status" class="hidden" role="alert"></p>
    <form id="resetForm" class="hidden" hidden>
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" name="new-password" autocomplete="new-password" required minlength="8" />
      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" name="confirm-password" autocomplete="new-password" required minlength="8" />
      <button type="submit" class="primary" id="resetSubmit">Update password</button>
    </form>
    <div class="actions hidden" id="actionsDone">
      <a class="primary" href="http://127.0.0.1:8765/">Open BAKLOG</a>
      <a class="ghost" href="/">Back to baklog.app</a>
    </div>
    <div class="actions hidden" id="actionsExpired">
      <a class="ghost" href="/">Back to baklog.app</a>
    </div>
  </main>
  <script type="module" src="/auth-reset.js"></script>
</body>
</html>
